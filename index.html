/* Parcelas na leitura: as mesmas colunas em todas as partes, para os valores ficarem alinhados de uma parte à outra. */
.contrato-parte-leitura .tabela-parcelas { table-layout: fixed; min-width: 720px; }

/* Cabeçalho de cartão com só o título: 56 px, como os de linha (16 + 24 + 16). */
.cartao-cabecalho:not(.cabecalho-linha) { min-height: 56px; padding-bottom: 15px; }

  .abas-botao { flex: 1 0 auto; justify-content: center; padding: 8px 12px; }

  /* No celular a linha das abas não fica presa: o erro de salvar aparece fixo no canto, para não passar despercebido. */
  .abas-salvar:has([data-estado="erro"]) { position: fixed; right: var(--e-3); bottom: var(--e-3); z-index: 20; height: 40px; border: 1px solid var(--cor-atrasado); background: var(--cor-superficie); }
}
/* Um só botão principal por tela: nas abas que têm o próprio “Salvar” (Processo, Escritório, Financeiro), o “Novo ▾” do topo fica no estilo padrão. */
.moldura-conteudo:has(.abas-pagina[data-aba-ativa="dados"], .abas-pagina[data-aba-ativa="processo"], .abas-pagina[data-aba-ativa="escritorio"], .abas-pagina[data-aba-ativa="financeiro"], .abas-pagina[data-aba-ativa="cadastro"]) .topo-linha .menu-suspenso-texto > .botao-principal {
  background: var(--cor-superficie); color: var(--cor-texto); border-color: var(--cor-borda); font-weight: 500; filter: none; }

/* Documentos ligados a tarefas, prazos e atos */
.documentos-item { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--e-3); font-size: 13px; }
.documento-chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
.documento-chip .botao-link { color: var(--cor-texto); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
.documento-chip .botao-link::before { content: ""; display: inline-block; width: 10px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid var(--cor-texto-2); border-radius: 1px; }
.documento-chip .botao-link:hover { text-decoration: underline; }
.documento-tirar { width: 24px; height: 24px; padding: 0; border: 0; background: none; color: var(--cor-texto-2); font: inherit; cursor: pointer; border-radius: 2px; }
.documento-tirar:hover, .documento-tirar:focus-visible { color: var(--cor-atrasado); background: var(--cor-fundo); outline: none; }
.lista-anexar li { display: flex; align-items: center; justify-content: space-between; gap: var(--e-3); min-height: 40px; }
.anexar-pasta { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0; border: 0; background: none; color: var(--cor-texto); font: inherit; text-align: left; cursor: pointer; }
.anexar-pasta::before { content: ""; width: 14px; height: 10px; border: 1.5px solid var(--cor-marca); border-radius: 1px; }
.anexar-pasta:hover { text-decoration: underline; }
/* Sino: de que escritório é o aviso (só para quem tem mais de um); o de outro escritório fica marcado. */
.sino-escritorio { color: var(--cor-texto-2); }
.sino-outro { color: var(--cor-texto); font-weight: 600; }
/* Aviso de carregamento (alto da tela): discreto, com barra amarela correndo. */
.indicador-carga { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: var(--e-2);
  max-width: calc(100vw - 32px); padding: 6px 12px; border: 1px solid var(--cor-borda); border-radius: 4px; background: var(--cor-superficie); color: var(--cor-texto);
  font-size: 13px; line-height: 20px; box-shadow: 0 4px 12px rgb(0 0 0 / 0.12); }
.indicador-carga-barra { flex: none; width: 32px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--cor-marca), transparent); background-size: 200% 100%; animation: carga-corre 1s linear infinite; }
@keyframes carga-corre { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .indicador-carga-barra { animation: none; background: var(--cor-marca); } }
.aguardando-ciencia { display: flex; flex-direction: column; gap: 4px; padding: var(--e-2) 0 var(--e-1); }

/* Janela da notificação: o aviso, a demanda, o texto publicado e o que fazer */

  background: var(--cor-fundo); white-space: pre-wrap; font-size: 13px; line-height: 20px; }
.notificacao-acoes { display: flex; flex-direction: column; border-top: 1px solid var(--cor-borda); padding-top: var(--e-2); }

.notificacao-acao { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 48px; padding: 8px var(--e-3); margin: 0 calc(-1 * var(--e-3)); width: calc(100% + 2 * var(--e-3));
  border: 0; border-left: 2px solid transparent; background: none; color: var(--cor-texto); font: inherit; text-align: left; cursor: pointer; }
.notificacao-acao:hover, .notificacao-acao:focus-visible { background: var(--cor-marca-suave); border-left-color: var(--cor-marca); outline: none; }

/* Visão “Todos os escritórios”: etiqueta discreta do escritório e o resumo de cada um */
.selo-escritorio { flex: none; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--cor-texto-2); }

/* Painel: subtítulos de grupo (h2) dentro da grade e seção de destaque dos prazos abertos */
.grade-titulo { grid-column: 1 / -1; margin-top: var(--e-3); font-size: var(--texto-subtitulo); line-height: var(--linha-subtitulo); }
/* Prazos abertos: cartão como os demais (sem borda de cor); a urgência fica só no selo de cada linha (10/11/2026). */
.cartao-rodape { padding: var(--e-2) var(--e-3); border-top: 1px solid var(--cor-borda); }
.tabela-prazos .selo-prazo { margin-left: 0; }

.tabela-prazos td:nth-child(4), .tabela-prazos td:nth-child(5) { white-space: normal; }

  .cartao-destaque > .cartao-cabecalho { flex-wrap: wrap; height: auto; min-height: 56px; row-gap: 0; padding-top: var(--e-2); padding-bottom: var(--e-2); }

}

/* Conferência com as tabelas do CNJ, dentro do formulário da demanda */
.conferencia-tpu { padding: var(--e-3); background: var(--cor-superficie-2); border-left: 2px solid var(--cor-vence-breve); }

/* Selo da movimentação relevante (pelo código do CNJ) */
.selo-relevancia { height: 20px; margin-right: var(--e-2); padding: 0 var(--e-1); vertical-align: 1px; }
.selo-relevancia.relevancia-alta { border-color: var(--cor-marca); color: var(--cor-marca); font-weight: 600; }

.prazos-sugeridos li { align-items: center; gap: var(--e-3); }

/* Processo parado: faixa no Resumo da demanda e linhas no Painel */

@media (max-width: 599px) { .aviso-parado { flex-wrap: wrap; } .aviso-parado > .botao { width: 100%; } }
.lista-painel .linha-prazo > .selo-prazo { margin-left: 0; margin-right: var(--e-2); flex: 0 0 auto; }

/* Contrato de honorários anexado, no alto de “Condições do contrato” */

.fila-envio li { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 3fr) minmax(0, 3fr) auto; grid-template-areas: "arq arq arq arq" "tipo pasta desc tirar" "nome nome nome nome";
  gap: var(--e-1) var(--e-3); align-items: end; padding: var(--e-2) 0; border-bottom: 1px solid var(--cor-borda); }
.fila-arquivo { grid-area: arq; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila-campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fila-campo:nth-of-type(1) { grid-area: tipo; } .fila-campo:nth-of-type(2) { grid-area: pasta; } .fila-campo:nth-of-type(3) { grid-area: desc; }
.fila-tirar { grid-area: tirar; }
.fila-campo select, .fila-campo input { width: 100%; height: var(--altura-compacta); padding: 0 var(--e-2); font: inherit; font-size: 14px;
  border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); background: var(--cor-fundo); color: var(--cor-texto); }
.fila-nome { grid-area: nome; font-size: 13px; color: var(--cor-texto-2); overflow-wrap: anywhere; }
.fila-nome .numero { color: var(--cor-texto); }
.fila-nome .campo-erro { display: block; }
.fila-envio li[data-feito] { color: var(--cor-texto-2); }
@media (max-width: 599px) {
  .fila-envio li { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "arq tirar" "tipo tipo" "pasta pasta" "desc desc" "nome nome"; }
}
.arquivos-demanda .cartao-corpo > * { min-width: 0; max-width: 100%; }

.arquivos-barra { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e-2) var(--e-3); }
.arquivos-barra .segmentos button { height: var(--altura-compacta); font-size: 14px; }
.arquivos-busca { height: var(--altura-compacta); flex: 1 1 200px; max-width: 320px; padding: 0 var(--e-2); font: inherit; font-size: 14px;
  border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); background: var(--cor-fundo); color: var(--cor-texto); }
.grupo-arquivos { display: flex; flex-direction: column; gap: var(--e-2); }
.grupo-arquivos + .grupo-arquivos { padding-top: var(--e-2); border-top: 1px solid var(--cor-borda); }
.grupo-arquivos .lista-titulo .numero { font-weight: 400; margin-left: var(--e-1); }

/* Selo do formato: PDF em amarelo sóbrio, o resto em cinza; pasta com a cor da marca */
.selo-arquivo { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 24px; border-radius: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .04em; background: var(--cor-superficie-2); color: var(--cor-texto-2); border: 1px solid var(--cor-borda); }
.selo-pdf { background: var(--cor-marca-suave); color: var(--cor-texto); border-color: var(--cor-marca); }
.selo-pasta { width: 24px; border: 0; background: none; color: var(--cor-marca); }

/* Grade: cartões de 160 px com capa 4:3 */
.arquivos-grade { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: var(--e-3); }
.arquivo-cartao { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.arquivo-cartao-abrir { display: flex; flex-direction: column; gap: var(--e-1); padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.capa-arquivo { display: flex; align-items: center; justify-content: center; aspect-ratio: 3 / 2; overflow: hidden;
  border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); background: var(--cor-superficie-2); }
.capa-arquivo img { width: 100%; height: 100%; object-fit: cover; object-position: top; background: #fff; }
.capa-arquivo .selo-arquivo { width: 56px; height: 32px; font-size: 12px; }
.capa-pasta .selo-pasta svg { width: 40px; height: 40px; }
.arquivo-cartao-abrir:hover .capa-arquivo, .arquivo-cartao-abrir:focus-visible .capa-arquivo { border-color: var(--cor-marca); }
.arquivo-cartao-abrir:focus-visible { outline: none; }
.arquivo-cartao-nome { font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.arquivo-cartao-meta { font-size: 12px; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arquivo-cartao-baixar { position: absolute; top: var(--e-1); right: var(--e-1); display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: var(--raio-controle); background: var(--cor-superficie); border: 1px solid var(--cor-borda); color: var(--cor-texto);
  opacity: 0; transition: opacity .12s; }
.arquivo-cartao:hover .arquivo-cartao-baixar, .arquivo-cartao-baixar:focus-visible { opacity: 1; }
@media (hover: none) { .arquivo-cartao-baixar { opacity: 1; } }

/* Lista e detalhes */
.arquivos-lista .arquivo-linha-nome { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 0; background: none; padding: var(--e-1) 0;
  font: inherit; color: inherit; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.arquivos-lista .arquivo-linha-nome .secundario { font-size: 13px; }
.acoes-arquivo { display: inline-flex; gap: var(--e-2); }
.arquivos-detalhes td:first-child { white-space: normal; min-width: 240px; }
.arquivo-detalhe-nome { display: flex; align-items: center; gap: var(--e-2); }
.arquivo-detalhe-nome .botao-texto { text-align: left; overflow-wrap: anywhere; }

@media (max-width: 599px) {
  .zona-envio { flex-wrap: wrap; }
  .zona-envio .botao { width: 100%; justify-content: center; }
  .arquivos-barra .segmentos { flex-direction: row; width: auto; }
  .arquivos-barra .segmentos button { border-top: 0; border-left: 1px solid var(--cor-borda); }
  .arquivos-barra .segmentos button:first-child { border-left: 0; }
  .arquivos-busca { max-width: none; }
  .arquivos-grade { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--e-2); }
  .arquivos-lista .acoes-arquivo .botao-compacto { min-width: 0; }
}
/* Detalhes: mesmas colunas em todos os grupos */
.arquivos-detalhes { table-layout: fixed; min-width: 760px; }
.arquivos-detalhes th:nth-child(1) { width: auto; }
.arquivos-detalhes th:nth-last-child(5) { width: 152px; }
.arquivos-detalhes th:nth-last-child(4):not(:first-child) { width: 136px; }
.arquivos-detalhes th:nth-last-child(3) { width: 96px; }
.arquivos-detalhes th:nth-last-child(2) { width: 128px; }
.arquivos-detalhes th:last-child { width: 168px; }
.arquivos-detalhes td { overflow: hidden; text-overflow: ellipsis; }

/* Processo de terceiros (só acompanhamento) */
.aviso-terceiros { margin: 0; padding: var(--e-2) var(--e-3); border-left: 3px solid var(--cor-borda-forte, var(--cor-borda)); background: var(--cor-superficie-2); font-size: 14px; line-height: 20px; color: var(--cor-texto-2); }
.aviso-terceiros strong { color: var(--cor-texto); font-weight: 600; }

/* Botão de copiar (Etapa 4.1): discreto, alinhado ao texto, sem mudar a altura da linha */
.copiar { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; min-width: 24px; height: 24px; margin: -4px 0 -4px 4px; padding: 0 4px;
  border: 1px solid transparent; border-radius: var(--raio-controle); background: none; color: var(--cor-texto-2); cursor: pointer; font: inherit; font-size: 12px; line-height: 1; }
.copiar:hover, .copiar:focus-visible { color: var(--cor-texto); border-color: var(--cor-borda); background: var(--cor-superficie-2); outline: none; }
.copiar[data-feito="ok"] { color: var(--cor-texto); border-color: var(--cor-marca); background: var(--cor-marca-suave); }
.copiar-aviso { white-space: nowrap; font-weight: 500; font-family: var(--fonte-interface); }
@media (hover: none) { .copiar { min-width: 32px; height: 32px; margin: -8px 0 -8px 0; } }

/* Leitor (Etapas 6.6 e 6.7): anterior/próximo, identificador do documento, Word, áudio e vídeo */
.navegar-documentos { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--e-2) var(--e-3);
  padding: var(--e-2) var(--e-3); border-bottom: 1px solid var(--cor-borda); }
.navegar-botoes { display: inline-flex; align-items: center; gap: var(--e-2); }
.navegar-botoes .numero { min-width: 64px; text-align: center; font-size: 13px; }
.navegar-id, .visualizador-id { font-size: 13px; color: var(--cor-texto); padding: 2px var(--e-2); border: 1px solid var(--cor-borda); border-radius: var(--raio-controle);
  background: var(--cor-superficie-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.visualizador-id { max-width: 420px; }
.visualizador-word { display: flex; flex-direction: column; align-items: center; gap: var(--e-3); background: var(--cor-superficie-2); }
.visualizador-word-barra { align-self: stretch; justify-content: space-between; padding: var(--e-2) var(--e-3) 0; }
.folha-word { width: 100%; max-width: 794px; margin: 0 auto var(--e-5); padding: 72px 76px; background: #fff; color: #1a1a1a; box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
  font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.folha-word h1, .folha-word h2, .folha-word h3 { color: #1a1a1a; margin: 1.2em 0 .5em; line-height: 1.3; text-align: left; hyphens: manual; }
.folha-word p { margin: 0 0 .8em; }
.folha-word table { border-collapse: collapse; width: 100%; margin: .8em 0; }
.folha-word td, .folha-word th { border: 1px solid #bbb; padding: 4px 8px; vertical-align: top; }
.folha-word img { max-width: 100%; height: auto; }
.folha-word a { color: inherit; }
.visualizador-midia { display: flex; align-items: center; justify-content: center; padding: var(--e-5) var(--e-3); }
.visualizador-midia audio { width: min(100%, 560px); }
.visualizador-midia video { max-width: 100%; max-height: 70vh; background: #000; }
@media (max-width: 599px) {
  .folha-word { padding: var(--e-4) var(--e-3); font-size: 15px; }
  .navegar-documentos { padding: var(--e-2); }
  .visualizador-id { max-width: 100%; }
}
.excluir-prazo { margin-left: auto; }

/* Linha do prazo (10/11/2026): cabeça com os dados à esquerda e as ações alinhadas à direita; embaixo, em largura total,
   ciência, observação, documentos, plano, avisos e formulários de encerramento. */
.vinculos li.linha-prazo:has(> .prazo-cabeca) { display: block; min-height: 0; padding: var(--e-3) 0; }
.prazo-cabeca { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--e-2) var(--e-4); flex-wrap: wrap; }
.prazo-info { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.prazo-info > span:first-child { font-weight: 500; }
.prazo-acoes { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--e-2); }
.prazo-acoes .seletor-compacto { height: var(--altura-compacta); padding: 0 8px; font-size: 13px; width: 200px; }
.prazo-corpo { display: flex; flex-direction: column; align-items: stretch; gap: var(--e-2); margin-top: var(--e-2); min-width: 0; }
.prazo-corpo:empty { display: none; }
.prazo-corpo .plano-lista li { display: grid; min-height: 32px; border-bottom: 0; }
@media (max-width: 767px) {
  .prazo-acoes { justify-content: flex-start; width: 100%; }
  .prazo-acoes .seletor-compacto { width: 100%; max-width: none; flex: 1 1 100%; }
  .prazo-acoes .botao-compacto { flex: 1 1 calc(50% - var(--e-2)); }
}

/* Ato do prazo nas listas (Painel, Tarefas): abre o popup do prazo; aparência de link, como os demais. */
.evento-link { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.evento-link:hover { color: var(--cor-texto); text-decoration-color: var(--cor-marca); }

/* Revisão geral de grade (10/11/2026) ------------------------------------------------------------ */
/* Campos nunca empurram a largura da linha (listas com opções longas, filtros em pares no celular). */
.campo { min-width: 0; }
.campo input, .campo select, .campo textarea { max-width: 100%; min-width: 0; }
.grade > *, .biblioteca-filtros > * { min-width: 0; }
/* Alvos de toque de 32 px nos botões pequenos de ícone (copiar, tirar documento), sem mudar a altura da linha. */
.copiar { min-width: 32px; height: 32px; margin: -8px 0 -8px 2px; }
.documento-tirar { min-width: 32px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center; }
/* Cartões empilhados: 24 px entre eles também quando a grade do Painel quebra em uma coluna. */
.grade:has(> .cartao) { row-gap: var(--e-4); }
.autos { gap: var(--e-4); }
/* Biblioteca: título do livro na escala (16). */
.livro-titulo { font-size: 16px; line-height: 24px; }
/* Celular: o cabeçalho do cartão quebra em duas linhas (título em cima, ações embaixo) em vez de sair da tela. */
@media (max-width: 599px) {
  .cartao-cabecalho.cabecalho-linha { flex-wrap: wrap; row-gap: var(--e-2); padding-top: var(--e-2); padding-bottom: var(--e-2); }
  .cabecalho-acoes { flex-wrap: wrap; white-space: normal; max-width: 100%; }
}
/* Listas dentro do corpo do cartão: sem linha antes do primeiro item nem depois do último (o cartão já tem borda). */
.cartao-corpo > .vinculos:first-child { border-top: 0; }
.cartao-corpo > .vinculos:last-child > li:last-child { border-bottom: 0; }
/* Celular: linhas com seletor e botões (partes, tarefas) — nome em cima, seletor na linha toda, botões repartindo a linha. */
@media (max-width: 599px) {
  .vinculos li:has(> select) { flex-wrap: wrap; row-gap: var(--e-2); padding: var(--e-2) 0; }
  .vinculos li:has(> select) > .vinculo-nome { flex: 1 1 100%; }
  .vinculos li:has(> select) > select { flex: 1 1 100%; max-width: none; }
  .vinculos li:has(> select) > .botao-compacto { flex: 1 1 0; }
}
@media (max-width: 599px) {
  .parte-topo .vinculo-nome { flex-basis: 100%; }
  .parte-topo select.seletor-compacto { flex: 1 1 100%; width: auto; }
  .vinculos li .parte-topo > .botao-compacto { flex: 1 1 0; }
}
/* Menu em faixa (celular e tablet): rola de lado sem mostrar a barra de rolagem. */
.moldura-menu { scrollbar-width: none; }
.moldura-menu::-webkit-scrollbar { display: none; }
/* Manual: em telas até 1023 px, “Mostrar na tela” fica embaixo do passo, alinhado ao texto (não à caixa de marcar). */
@media (max-width: 1023px) { .manual-passos li > .botao { margin-left: 24px; } }
.manual-passos li > .botao { flex: none; }
/* Botão compacto de largura fixa nas tabelas (Usar escritório). */
.botao-96 { min-width: 96px; justify-content: center; }
.ponto-marca { background: var(--cor-marca); }
@media (max-width: 599px) { .condensado-celular { display: inline; } }
/* Prazos dentro do Andamento: sem a linha do último prazo somada à divisória da subseção. */
.subsecao .vinculos > li:last-child { border-bottom: 0; }

/* Movimentação: título abre a janela de detalhes; na janela, texto na íntegra, documento, anexos e prazo (11/11/2026). */
.mov-abrir { font: inherit; font-weight: 500; color: inherit; text-align: left; padding: 0; text-decoration: underline; text-decoration-color: var(--cor-borda); text-underline-offset: 3px; }
.mov-abrir:hover { text-decoration-color: var(--cor-marca); }
.mov-detalhe .lista-titulo { margin: 0; }
.mov-integra { max-height: 50vh; padding: var(--e-2) var(--e-3); border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); background: var(--cor-superficie-2); line-height: 22px; }
.mov-documento { flex: 1 1 320px; min-width: 0; max-width: 100%; height: var(--altura-padrao); padding: 0 var(--e-2); font: inherit; font-size: 14px;
  border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); background: var(--cor-fundo); color: var(--cor-texto); }
.mov-prazos { margin: 0; padding-left: var(--e-4); font-size: 14px; line-height: 22px; }
/* Rodapé de janela no celular com três ou mais botões: dois por linha, texto numa linha só (11/11/2026). */
@media (max-width: 599px) {
  .dialogo-rodape:has(> .botao:nth-of-type(3)) { flex-wrap: wrap; }
  .dialogo-rodape:has(> .botao:nth-of-type(3)) > .botao { flex: 1 1 calc(50% - var(--e-2)); white-space: nowrap; padding-left: var(--e-2); padding-right: var(--e-2); }
}
/* Plano: trecho da descrição e checklist como subtarefas, alinhados ao título da tarefa (11/11/2026). */
.plano-descricao, .plano-subtarefas { grid-column: 2 / -1; }
.plano-descricao { font-size: 13px; line-height: 20px; margin-top: -4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.plano-subtarefas { list-style: none; margin: 0 0 var(--e-1); padding: 0 0 0 var(--e-3); border-left: 1px solid var(--cor-borda); display: flex; flex-direction: column; }
.plano-subtarefas li { display: block; min-height: 0; border: 0; padding: 0; }
.plano-subtarefas .marcacao { min-height: 28px; font-size: 13px; line-height: 20px; gap: var(--e-2); }
.plano-subtarefas li.feita span { color: var(--cor-texto-2); text-decoration: line-through; }

/* Repaginar os autos (12/11/2026): no sumário, com o PDF ao lado. */
.repaginar { padding: var(--e-3); overflow: auto; flex: 1; min-height: 0; }
.repaginar-deslocar { align-items: flex-end; flex-wrap: nowrap; }
.repaginar-lista { list-style: none; margin: 0; padding: 0; }
.repaginar-progresso { width: 100%; height: 6px; accent-color: var(--cor-marca); }
.repaginar-passo { flex: 1 1 140px; min-width: 0; }
.repaginar-deslocar > .botao { flex: 0 0 auto; }
@media (max-width: 899px) { .autos-sumario.autos-revisando { max-height: none; } }
.repaginar-item { display: grid; gap: var(--e-1); padding: var(--e-2) 0; border-bottom: 1px solid var(--cor-borda); min-width: 0; }
.repaginar-campos { display: flex; align-items: center; gap: var(--e-2); }
.repaginar-campos input { width: 72px; height: 32px; padding: 0 var(--e-2); }

/* Distribuir revisões (Etapa 5.2): prévia por dia, com barra proporcional. */
.distribuir-dias { max-height: 50dvh; overflow: auto; }
.distribuir-dias li { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr) 40px; align-items: center; gap: var(--e-3); }
.distribuir-dias li > .numero:last-child { text-align: right; }
.distribuir-barra { height: 8px; background: var(--cor-fundo-2, var(--cor-borda)); border-radius: 2px; overflow: hidden; }
.distribuir-barra > span { display: block; height: 100%; background: var(--cor-marca); }

/* Criador de petições (Etapa 9.1): módulos marcáveis, com o texto à mostra. */
.peticao-blocos { display: grid; gap: var(--e-2); border: 0; padding: 0; margin: 0; min-width: 0; }
.peticao-blocos > legend { padding: 0; margin-bottom: var(--e-2); }
.peticao-bloco { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--e-3); min-width: 0; }
.peticao-bloco-texto { flex: 0 0 100%; white-space: pre-wrap; padding-left: 28px; box-sizing: border-box; }
.cobertura-barra { display: block; min-width: 80px; }

/* Gráficos (Fase 12): uma série, no amarelo do produto ajustado para contraste em cada modo (validado: 3:1 na superfície). */
:root { --graf-1: #9c7d22; --graf-grade: #e6e6e2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --graf-1: #b08e3a; --graf-grade: #2c2c2c; } }
:root[data-theme="dark"] { --graf-1: #b08e3a; --graf-grade: #2c2c2c; }
.grafico { display: grid; gap: var(--e-2); min-width: 0; }
.grafico-h { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.grafico-h li { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr); align-items: center; gap: var(--e-3); min-width: 0; }
.grafico-h .rotulo-barra { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.grafico-h .trilho { display: flex; align-items: center; gap: var(--e-2); min-width: 0; }
.grafico-h .barra { height: 16px; min-width: 2px; background: var(--graf-1); border-radius: 0 4px 4px 0; }
.grafico-h .valor, .grafico-v .valor { font-family: var(--fonte-numeros); font-size: 12px; color: var(--cor-texto-2); white-space: nowrap; }
.grafico-v { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; align-items: end; height: 160px; border-bottom: 1px solid var(--graf-grade); padding: 0; margin: 0; list-style: none; }
.grafico-v li { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.grafico-v .barra { width: min(24px, 70%); background: var(--graf-1); border-radius: 4px 4px 0 0; min-height: 0; }
.grafico-v .valor { margin-bottom: 2px; }
.grafico-eixo { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; font-size: 11px; color: var(--cor-texto-2); text-align: center; }
.grafico-eixo span { overflow: visible; white-space: nowrap; }
.grafico a { color: inherit; text-decoration: none; }
.grafico a:hover .barra, .grafico a:focus-visible .barra { filter: brightness(1.12); }
.grafico-tabela summary { cursor: pointer; }
.painel-indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--e-4); }
.indicador-valor.texto-longo { font-size: 20px; line-height: 28px; }
.painel-indicadores .cartao-corpo { display: grid; gap: 4px; }
.indicador-base { font-size: 12px; color: var(--cor-texto-2); }
.indicador-base.pouco { font-style: italic; }
.filtros-estatisticas { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--e-3); align-items: end; }
.graficos-dois { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: var(--e-4); }

/* % concluído (Etapa 12.8) */
.progresso { display: inline-flex; align-items: center; gap: var(--e-2); min-width: 0; }
.progresso-trilho { width: 96px; height: 8px; background: var(--graf-grade); border-radius: 4px; overflow: hidden; flex: none; }
.progresso-barra { display: block; height: 100%; background: var(--graf-1); border-radius: 0 4px 4px 0; }
.progresso-texto { font-size: 13px; white-space: nowrap; }
.andamento-resumo dd { font-size: 16px; line-height: 24px; }
.atendimento-resumo { white-space: pre-wrap; }
.atendimentos-lista > li { align-items: flex-start; padding: var(--e-2) 0; }
.atendimentos-lista .opcao-texto > span { white-space: normal; overflow: visible; text-overflow: clip; }
.atendimentos-lista .barra-acoes { flex: none; flex-wrap: nowrap; }
@media (max-width: 599px) { .atendimentos-lista > li { flex-direction: column; } }
.atendimentos-lista .opcao-texto { flex: 1 1 auto; min-width: 0; }

/* Leitor único (6.8): busca no texto, OCR e citação */
.visualizador-ferramentas { display: flex; flex-wrap: wrap; gap: var(--e-2) var(--e-3); align-items: center; padding: var(--e-2) var(--e-3); border-bottom: 1px solid var(--cor-borda); }
.visualizador-busca { display: flex; gap: var(--e-2); align-items: center; flex: 0 1 360px; min-width: 0; }
.visualizador-busca input { flex: 1 1 auto; min-width: 0; height: var(--altura-compacta); }
.visualizador-ocr { display: inline-flex; flex-wrap: wrap; gap: var(--e-2); align-items: center; }
.visualizador-achados { max-height: 240px; overflow: auto; border-bottom: 1px solid var(--cor-borda); background: var(--cor-superficie); }
.visualizador-achados-topo { display: flex; justify-content: space-between; gap: var(--e-3); align-items: baseline; margin: 0; padding: var(--e-2) var(--e-3); position: sticky; top: 0; background: var(--cor-superficie); border-bottom: 1px solid var(--cor-borda); }
.visualizador-achados ol { list-style: none; margin: 0; padding: 0; }
.visualizador-achado { display: grid; grid-template-columns: 56px 1fr; gap: var(--e-2); width: 100%; text-align: left; padding: var(--e-2) var(--e-3); background: none; border: 0; border-bottom: 1px solid var(--cor-borda); color: var(--cor-texto); font: inherit; font-size: 13px; line-height: 20px; cursor: pointer; }
.visualizador-achado:hover, .visualizador-achado:focus-visible { background: var(--cor-marca-suave); }
.visualizador-achado mark { background: var(--cor-marca-suave); color: inherit; outline: 1px solid var(--cor-marca); }
.marca-busca { position: absolute; pointer-events: none; outline: 2px solid var(--cor-marca); background: var(--cor-marca-suave); z-index: 1; }
.textLayer .ocr-palavra { font-family: sans-serif; line-height: 1; }
@media (max-width: 767px) {
  .visualizador-busca { flex: 1 1 100%; }
}

/* Pendências da demanda (13.2): faixa abaixo do topo, em todas as abas */
.pendencias-demanda { border: 1px solid var(--cor-borda); border-left: 3px solid var(--cor-marca); background: var(--cor-superficie); padding: var(--e-3); display: flex; flex-direction: column; gap: var(--e-2); }
.pendencias-demanda[data-alerta] { border-left-color: var(--cor-atrasado); }
.pendencias-titulo { font-size: 13px; line-height: 20px; font-weight: 600; margin: 0; }
.pendencias-lista { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--e-2) var(--e-3); }
.pendencia { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: var(--e-2); align-items: baseline; min-width: 0; }
.pendencia-tipo { grid-row: 1 / span 2; font-size: 12px; line-height: 20px; padding: 0 var(--e-2); border: 1px solid var(--cor-borda); color: var(--cor-texto-2); white-space: nowrap; }
.pendencia-texto { font-size: 14px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; text-align: left; }
.pendencia-quando { font-size: 12px; line-height: 16px; color: var(--cor-texto-2); }
.pendencia[data-estado="atrasado"] .pendencia-quando, .pendencia[data-estado="hoje"] .pendencia-quando { color: var(--cor-atrasado); }
.pendencia[data-estado="atrasado"] .pendencia-tipo { border-color: var(--cor-atrasado); color: var(--cor-atrasado); }

/* Fases, recursos e incidentes (13.1) */
/* Linha do processo (18/11/2026): data à esquerda, trilho vertical, marcos de distribuição e arquivamento. */
.linha-processo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.linha-processo > li { position: relative; display: grid; grid-template-columns: 112px 1fr auto; gap: var(--e-3); align-items: start; padding: var(--e-3) 0 var(--e-3) 0; }
.linha-processo > li::before { content: ""; position: absolute; left: 124px; top: 0; bottom: 0; width: 2px; background: var(--cor-borda); }
.linha-processo > li:first-child::before { top: calc(var(--e-3) + 8px); }
.linha-processo > li:last-child::before { bottom: calc(100% - var(--e-3) - 8px); }
.linha-processo > li::after { content: ""; position: absolute; left: 119px; top: calc(var(--e-3) + 3px); width: 12px; height: 12px; border-radius: 50%; background: var(--cor-superficie); border: 2px solid var(--cor-texto-2); box-sizing: border-box; }
.linha-processo > li > .linha-conteudo { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-left: var(--e-4); }
.linha-processo .linha-data { color: var(--cor-texto-2); font-size: var(--texto-rotulo); padding-top: 1px; }
.linha-ate { display: block; }
@media (max-width: 767px) { .linha-ate { display: inline; margin-left: 6px; } }
.linha-etapa[data-categoria="fase"]::after { border-color: var(--cor-marca); background: var(--cor-marca); }
.linha-etapa[data-categoria="recurso"]::after { border-color: var(--cor-texto); }
.linha-etapa[data-categoria="incidente"]::after { border-style: dashed; }
.linha-etapa[data-situacao="em_curso"]::after { box-shadow: 0 0 0 3px var(--cor-marca-suave); }
.linha-marco::after { border-radius: 2px !important; }
.linha-marco[data-tipo="arquivamento"]:not([data-feito])::after { border-style: dashed; }
.linha-marco[data-tipo="arquivamento"]:not([data-feito]) .linha-conteudo strong { color: var(--cor-texto-2); font-weight: 500; }
.linha-etapa .selo-tipo { margin-right: 2px; }
.etapa-sessao { color: var(--cor-texto); font-weight: 600; }
@media (max-width: 767px) {
  .linha-processo > li { grid-template-columns: 1fr auto; padding-left: 28px; gap: var(--e-1) var(--e-3); }
  .linha-processo > li::before { left: 7px; }
  .linha-processo > li::after { left: 2px; }
  .linha-processo .linha-data { grid-column: 1 / -1; }
  .linha-processo > li > .linha-conteudo { padding-left: 0; }
}
/* Atualizar pelo processo: propostas para marcar */
.lista-sugestoes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lista-sugestoes > li { padding: var(--e-2) 0; border-bottom: 1px solid var(--cor-borda); }
.lista-sugestoes > li:last-child { border-bottom: 0; }
.opcao-marcar { display: grid; grid-template-columns: auto 1fr; gap: var(--e-3); align-items: start; cursor: pointer; }
.opcao-marcar input { margin-top: 3px; accent-color: var(--cor-marca); }
.opcao-marcar .opcao-texto .secundario { white-space: normal; }
/* Autos numa janela da demanda */
/* O leitor ocupa a janela inteira e acompanha o tamanho dela (18/11/2026): o iframe estica no corpo da janela
   e, dentro dele, os autos usam a altura toda do iframe em vez da conta da página cheia. */
.autos-iframe { display: block; width: 100%; height: min(78vh, 900px); border: 0; background: var(--cor-fundo); }
.janela-tela .autos-iframe { flex: 1 1 auto; height: auto; min-height: 0; }
.autos-janela { padding: var(--e-3); height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; min-height: 0; }
.autos-janela > .autos { flex: 1 1 auto; height: auto; min-height: 0; }
@media (max-width: 899px) { .autos-janela { height: auto; } .autos-janela > .autos { flex: none; } }
/* Compromissos dentro do Andamento: escondidos pelo filtro, com as janelas montadas */
.andamento-compromissos { padding-top: var(--e-4); border-top: 1px solid var(--cor-borda); display: flex; flex-direction: column; gap: var(--e-4); }
.andamento-compromissos[data-ocultar="sim"] { padding: 0; border: 0; gap: 0; }
.andamento-compromissos[data-ocultar="sim"] .subsecao-titulo, .andamento-compromissos[data-ocultar="sim"] .subsecao > .pilha-curta > :not(dialog) { display: none; }
.andamento-compromissos[data-ocultar="sim"] .subsecao { padding: 0; }
.andamento-prazos[data-ocultar="sim"] + .andamento-compromissos:not([data-ocultar]) { padding-top: 0; border-top: 0; }
.andamento-compromissos + .subsecao { padding-top: var(--e-4); border-top: 1px solid var(--cor-borda); }
.andamento-compromissos[data-ocultar="sim"] + .subsecao { padding-top: 0; border-top: 0; }
/* Aviso da demanda no sino (13.3): de que demanda, de quem, o que aconteceu, o que muda */
.sino-demanda { font-size: 12px; line-height: 16px; color: var(--cor-texto-2); }
.notificacao-ficha { display: grid; grid-template-columns: 96px 1fr; gap: var(--e-1) var(--e-3); margin: 0; padding: var(--e-3); border: 1px solid var(--cor-borda); background: var(--cor-superficie-2); }
.notificacao-ficha > div { display: contents; }
.notificacao-ficha dd { margin: 0; min-width: 0; }
.notificacao-movimentos .selo-tipo[data-alta] { border-color: var(--cor-marca); }
.notificacao-propostas { display: flex; flex-direction: column; gap: var(--e-2); }
.notificacao-proposta { border-left: 3px solid var(--cor-marca); }
/* Sugestões lidas no texto da movimentação (compromisso e prazo) */
.mov-sugestoes { display: flex; flex-direction: column; gap: var(--e-1); }
.mov-sugestao { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e-1) var(--e-2); font-size: 13px; line-height: 20px; padding: var(--e-1) var(--e-2); border-left: 3px solid var(--cor-marca); background: var(--cor-marca-suave); }
.selo-sugestao { height: 20px; font-size: 11px; border-color: var(--cor-marca); }
/* Espelho (18/11/2026): dado editado em outra seção, aqui só para leitura, na altura de um campo. */
.espelho-valor { display: flex; align-items: center; min-height: 40px; padding: 0 var(--e-3); background: var(--cor-superficie-2); border: 1px dashed var(--cor-borda); color: var(--cor-texto); }
/* Subtítulo dentro de um cartão (ex.: Reforma em recurso) */
.subtitulo-secao { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--cor-texto); }
h4.cartao-corpo.subtitulo-secao { padding-bottom: 0; }
/* Campo com botão ao lado (ex.: link da sala + “Gerar link do Meet”) */
.campo-com-botao { display: flex; gap: var(--e-2); min-width: 0; }
.campo-com-botao > input { flex: 1 1 auto; min-width: 0; }
.campo-com-botao > .botao { flex: 0 0 auto; }
@media (max-width: 479px) { .campo-com-botao { flex-direction: column; } }
/* Salvar automático (18/11/2026): o estado fica fixo no alto da aba enquanto se rola. */
.barra-salvar { position: sticky; top: calc(57px + var(--e-2)); z-index: 4; display: flex; justify-content: flex-end; pointer-events: none; margin-bottom: calc(-1 * var(--e-2)); }
.aviso-salvar { pointer-events: auto; margin: 0; padding: 2px var(--e-3); font-size: var(--texto-rotulo); line-height: 24px; color: var(--cor-texto-2);
  background: var(--cor-superficie); border: 1px solid var(--cor-borda); }
.aviso-salvar[data-estado="salvando"], .aviso-salvar[data-estado="pendente"] { color: var(--cor-texto); }
.aviso-salvar[data-estado="salvo"] { border-color: var(--cor-marca); }
.aviso-salvar[data-estado="erro"] { color: var(--cor-atrasado); border-color: var(--cor-atrasado); }
.alinha-campo > .aviso-salvar { display: inline-block; }
/* Papel da aba (18/11/2026): uma linha que diz o que cabe ali. */
.aba-papel { margin: 0 0 var(--e-3); font-size: var(--texto-rotulo); line-height: 20px; color: var(--cor-texto-2); }
/* Marcar como vista direto na lista do sino */
.sino-lista > li { position: relative; }
.sino-vista { position: absolute; right: var(--e-4); top: var(--e-3); font-size: var(--texto-rotulo); background: var(--cor-superficie); padding: 0 var(--e-1); }
.sino-lista > li:has(.sino-vista) .sino-meta { padding-right: 130px; }
/* Marcos do processo na Linha (liminar, sentença, trânsito…): ponto menor, links para a movimentação e o documento. */
.linha-marco-processo::after { width: 8px !important; height: 8px !important; left: 121px !important; top: calc(var(--e-3) + 5px) !important; border-radius: 50% !important; background: var(--cor-texto-2) !important; border: 0 !important; }
.linha-marco-processo .linha-conteudo strong { font-weight: 500; }
.linha-marco-processo[data-tipo="sentenca"] .linha-conteudo strong, .linha-marco-processo[data-tipo="acordao"] .linha-conteudo strong,
.linha-marco-processo[data-tipo="transito"] .linha-conteudo strong, .linha-marco-processo[data-tipo="liminar"] .linha-conteudo strong { font-weight: 600; }
.linha-links { gap: var(--e-3); flex-wrap: nowrap; }
@media (max-width: 767px) { .linha-marco-processo::after { left: 4px !important; } }
.opcao-inline { display: inline-flex; align-items: center; gap: var(--e-1); font-size: var(--texto-rotulo); color: var(--cor-texto-2); cursor: pointer; }
.opcao-inline input { accent-color: var(--cor-marca); }
/* Resumo do documento nos Autos e da movimentação */
.resumo-documento { padding: var(--e-2) var(--e-3); border-bottom: 1px solid var(--cor-borda); display: flex; flex-direction: column; gap: var(--e-2); }
.resumo-texto { padding: var(--e-3); background: var(--cor-superficie-2); border-left: 3px solid var(--cor-marca); display: flex; flex-direction: column; gap: var(--e-1); }
.resumo-texto p { margin: 0; }
.mov-resumo { margin-left: var(--e-2); font-size: var(--texto-rotulo); }
/* Tela de erro (sem conexão ou falha no meio de uma ação) */
.pagina-erro { max-width: 640px; margin: var(--e-8, 64px) auto; padding: 0 var(--margem-pagina, 16px); }
/* Segmentos em tela estreita: rolam dentro da própria barra em vez de sair da tela. */
@media (max-width: 599px) {
  .segmentos:not(.abas-grade) { overflow-x: auto; scrollbar-width: none; }
  .segmentos:not(.abas-grade) > button, .segmentos:not(.abas-grade) > a { flex: 0 0 auto; white-space: nowrap; }
}
/* Andamento no celular: o filtro desce para uma linha própria e rola dentro dela. */
@media (max-width: 599px) {
  #andamento > .cartao-cabecalho { flex-wrap: wrap; padding-top: var(--e-2); padding-bottom: var(--e-2); }
  #andamento > .cartao-cabecalho > .cabecalho-acoes { flex-wrap: wrap; white-space: normal; min-width: 0; max-width: 100%; }
  #andamento > .cartao-cabecalho .segmentos { max-width: 100%; flex: 1 1 100%; }
}

/* Cards de registro (19/11/2026): números, processos ligados, recursos, incidentes e fases. Resumo no card, edição na janela. */
.lista-cartoes { display: grid; grid-template-columns: 1fr; gap: var(--e-3); }
@media (min-width: 900px) { .lista-cartoes { grid-template-columns: 1fr 1fr; } }
.cartao-registro { display: flex; flex-direction: column; gap: var(--e-2); min-width: 0; padding: var(--e-3);
  background: var(--cor-fundo); border: 1px solid var(--cor-borda); border-radius: var(--raio-superficie); }
.cartao-registro[data-destaque="sim"] { box-shadow: inset 3px 0 0 var(--cor-marca); }
.cartao-registro-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--e-2); min-height: var(--altura-compacta); }
.cartao-registro-titulo { display: flex; align-items: center; flex-wrap: wrap; gap: var(--e-2); min-width: 0; line-height: var(--linha-corpo); }
.cartao-registro-titulo strong { overflow-wrap: anywhere; }
.cartao-registro-topo .barra-acoes { flex-shrink: 0; }
.cartao-registro-dados { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: var(--e-2) var(--e-3); margin: 0; }
.cartao-registro-dados div { min-width: 0; }
.cartao-registro-dados div[data-largo="sim"] { grid-column: 1 / -1; }
.cartao-registro-dados .numero { overflow-wrap: normal; }
.cartao-registro-dados dt { font-size: var(--texto-rotulo); line-height: var(--linha-rotulo); color: var(--cor-texto-2); }
.cartao-registro-dados dd { margin: 0; font-size: var(--texto-corpo); line-height: var(--linha-corpo); overflow-wrap: anywhere; }
.cartao-registro p { margin: 0; }

/* Fluxo das fases no alto da Linha do processo (19/11/2026): Conhecimento → Recursos → Cumprimento → Arquivamento. */
.fluxo-fases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--e-2); margin: 0; padding: 0; list-style: none; counter-reset: fase; }
.fluxo-fases li { position: relative; display: flex; flex-direction: column; gap: 0; min-width: 0; padding: var(--e-2) var(--e-3); border: 1px solid var(--cor-borda);
  border-top-width: 3px; border-radius: var(--raio-superficie); background: var(--cor-fundo); }
.fluxo-fases li:not(:last-child)::after { content: ""; position: absolute; top: 50%; right: calc(-1 * var(--e-2)); width: var(--e-2); border-top: 1px solid var(--cor-borda); }
.fluxo-fases li[data-estado="feito"] { border-top-color: var(--cor-texto-2); }
.fluxo-fases li[data-estado="atual"] { border-color: var(--cor-marca); border-top-color: var(--cor-marca); }
.fluxo-fases li[data-estado="futuro"], .fluxo-fases li[data-estado="sem"] { border-style: dashed; border-top-style: solid; color: var(--cor-texto-2); }
.fluxo-nome { font-weight: 600; line-height: var(--linha-corpo); }
.fluxo-estado, .fluxo-detalhe { font-size: var(--texto-rotulo); line-height: var(--linha-rotulo); color: var(--cor-texto-2); }
.fluxo-fases li[data-estado="atual"] .fluxo-estado { color: var(--cor-texto); font-weight: 600; }
.fluxo-datas { font-size: var(--texto-rotulo); line-height: var(--linha-corpo); }
@media (max-width: 720px) {
  .fluxo-fases { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fluxo-fases li:nth-child(2n)::after { display: none; }
}

/* Previsão de caixa (Etapa 12.9): certo cheio, provável tracejado por cima. */
.grafico-v .barra-certa { border-radius: 0; }
.grafico-v .barra-provavel { border-radius: 4px 4px 0 0; background: repeating-linear-gradient(135deg, var(--graf-1) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--graf-1); }
.grafico-v li:has(.barra-provavel[style*="height: 0%"]) .barra-certa { border-radius: 4px 4px 0 0; }
.grafico-legenda { display: flex; align-items: center; gap: var(--e-2); margin: 0; font-size: var(--texto-rotulo); color: var(--cor-texto-2); }
.legenda-certa, .legenda-provavel { display: inline-block; width: 12px; height: 12px; border-radius: 2px; background: var(--graf-1); }
.legenda-provavel { background: repeating-linear-gradient(135deg, var(--graf-1) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--graf-1); margin-left: var(--e-2); }
.tabela-rolagem { overflow-x: auto; }
.tabela td.quebra { white-space: normal; overflow-wrap: anywhere; min-width: 128px; }
.lista-cartoes.lista-cartoes-uma { grid-template-columns: 1fr; }
.cartao-registro[data-urgente="sim"] { box-shadow: inset 3px 0 0 var(--cor-atrasado); }
/* Cards no celular: título numa linha, ações na de baixo, botões do tamanho do texto (não a largura toda). */
