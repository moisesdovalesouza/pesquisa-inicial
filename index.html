<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Publicações do DJEN, processos e jurisprudência de todos os tribunais.">
<meta name="theme-color" content="#1c1b19">
<title>Pesquisa Inicial</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icone.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icone-32.png">
<link rel="apple-touch-icon" href="assets/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/*
 * Estilo gráfico — fonte da verdade: "Diretrizes iniciais", seção Estilo gráfico.
 * Grade de 8 px, cantos de 2 px (controles) e 4 px (superfícies), três cores de marca.
 * Tema: data-theme="light" | "dark" no <html>; sem atributo, segue o sistema.
 */


:root {
  /* Cores — modo claro */
  --cor-fundo: #fafaf8;
  --cor-superficie: #ffffff;
  --cor-superficie-2: #f2f2ee;
  --cor-borda: #d6d6d2;
  --cor-texto: #1a1a1a;
  --cor-texto-2: #5c5c58;
  --cor-marca: #b8962e;
  --cor-produto: #b8962e;          /* amarelo do Termo Inicial (logo); --cor-marca segue a cor do escritório */
  --cor-marca-lateral: var(--cor-marca);
  --cor-sobre-marca: #1a1a1a;
  --cor-marca-suave: rgba(184, 150, 46, 0.14);
  --cor-atrasado: #9a3b2e;
  --cor-vence-breve: #8a6d1f;
  --cor-confirmacao: #4a6b45;
  --cor-lateral: #1a1a1a;
  --cor-lateral-borda: #2e2e2e;
  --cor-lateral-texto: #ededea;
  --cor-lateral-texto-2: #a3a39e;

  /* Tipografia */
  --fonte-interface: "IBM Plex Sans", system-ui, sans-serif;
  --fonte-leitura: "IBM Plex Serif", Georgia, serif;
  --fonte-numeros: "IBM Plex Mono", ui-monospace, monospace;

  --texto-titulo: 24px;      --linha-titulo: 32px;
  --texto-subtitulo: 18px;   --linha-subtitulo: 24px;
  --texto-secao: 16px;       --linha-secao: 24px;
  --texto-corpo: 14px;       --linha-corpo: 24px;
  --texto-rotulo: 12px;      --linha-rotulo: 16px;

  /* Espaçamento (grade de 8 px; 4 px só para ajuste fino) */
  --e-1: 4px;
  --e-2: 8px;
  --e-3: 16px;
  --e-4: 24px;
  --e-5: 32px;
  --e-6: 48px;

  /* Componentes */
  --raio-controle: 2px;
  --raio-superficie: 4px;
  --altura-compacta: 32px;
  --altura-padrao: 40px;
  --margem-pagina: 32px;

  /* Marca: o ícone é sempre escuro; no modo escuro ganha um tom acima do fundo */
  --marca-fundo-icone: #1a1a1a;
  --marca-traco-icone: #ededea;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --marca-fundo-icone: #252525; }
}

:root[data-theme="dark"] { --marca-fundo-icone: #252525; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cor-fundo: #141414;
    --cor-superficie: #1e1e1e;
    --cor-superficie-2: #252525;
    --cor-borda: #333333;
    --cor-texto: #ededea;
    --cor-texto-2: #a3a39e;
    --cor-marca: #c9a84c;
    --cor-produto: #c9a84c;
    --cor-sobre-marca: #141414;
    --cor-marca-suave: rgba(201, 168, 76, 0.16);
    --cor-atrasado: #c26a5c;
    --cor-vence-breve: #c9a84c;
    --cor-confirmacao: #7fa078;
    --cor-lateral: #0e0e0e;
    --cor-lateral-borda: #262626;
    --cor-lateral-texto: #ededea;
    --cor-lateral-texto-2: #8c8c87;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --cor-fundo: #141414;
  --cor-superficie: #1e1e1e;
  --cor-superficie-2: #252525;
  --cor-borda: #333333;
  --cor-texto: #ededea;
  --cor-texto-2: #a3a39e;
  --cor-marca: #c9a84c;
  --cor-produto: #c9a84c;
  --cor-sobre-marca: #141414;
  --cor-marca-suave: rgba(201, 168, 76, 0.16);
  --cor-atrasado: #c26a5c;
  --cor-vence-breve: #c9a84c;
  --cor-confirmacao: #7fa078;
  --cor-lateral: #0e0e0e;
  --cor-lateral-borda: #262626;
  --cor-lateral-texto: #ededea;
  --cor-lateral-texto-2: #8c8c87;
  color-scheme: dark;
}

/* Tamanhos de tela (Diretrizes › Regramento de design): compacta < 600, média 600–1023, expandida 1024–1439, ampla ≥ 1440. */
@media (max-width: 1023px) {
  :root { --margem-pagina: 24px; }
}
@media (max-width: 599px) {
  :root { --margem-pagina: 16px; }
}

/* Base */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cor-fundo);
  color: var(--cor-texto);
  font-family: var(--fonte-interface);
  font-size: var(--texto-corpo);
  line-height: var(--linha-corpo);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: var(--texto-titulo); line-height: var(--linha-titulo); font-weight: 600; }
h2 { font-size: var(--texto-subtitulo); line-height: var(--linha-subtitulo); font-weight: 600; }
h3 { font-size: var(--texto-secao); line-height: var(--linha-secao); font-weight: 600; }
:focus-visible { outline: 2px solid var(--cor-marca); outline-offset: 2px; }

/* Utilitários de texto */
.rotulo { font-size: var(--texto-rotulo); line-height: var(--linha-rotulo); font-weight: 500; color: var(--cor-texto-2); }
.secundario { color: var(--cor-texto-2); }
.numero { font-family: var(--fonte-numeros); font-variant-numeric: tabular-nums; }
.leitura { font-family: var(--fonte-leitura); text-align: justify; hyphens: auto; }
.direita { text-align: right; }

/* Botões */
.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e-2);
  height: var(--altura-padrao); padding: 0 var(--e-3);
  border: 1px solid var(--cor-borda); border-radius: var(--raio-controle);
  background: var(--cor-superficie); color: var(--cor-texto);
  font: inherit; font-weight: 500; cursor: pointer; text-decoration: none;
}
.botao:hover { background: var(--cor-superficie-2); }
.botao-principal { background: var(--cor-marca); border-color: var(--cor-marca); color: var(--cor-sobre-marca); font-weight: 600; }
.botao-principal:hover { background: var(--cor-marca); filter: brightness(0.95); }
.botao-compacto { height: var(--altura-compacta); padding: 0 12px; font-size: 13px; }
.botao:disabled { opacity: 0.5; cursor: not-allowed; }

/* Campos */
.campo { display: flex; flex-direction: column; gap: var(--e-1); }
.campo input, .campo select, .campo textarea, .tabela-parcelas input:not([type="checkbox"]), .tabela-leitura select, .vinculos li > select, select.seletor-compacto, .ordem-docs .ordem-descricao {
  height: var(--altura-padrao); padding: 0 12px;
  border: 1px solid var(--cor-borda); border-radius: var(--raio-controle);
  background: var(--cor-fundo); color: var(--cor-texto); font: inherit;
}
.campo textarea { height: auto; min-height: 96px; padding: var(--e-2) 12px; }

/* Superfícies */
.cartao { background: var(--cor-superficie); border: 1px solid var(--cor-borda); border-radius: var(--raio-superficie); }
.cartao-cabecalho { padding: var(--e-3); border-bottom: 1px solid var(--cor-borda); }
.cartao-corpo { padding: var(--e-3); }

/* Grade de 12 colunas */
.grade { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--e-3) var(--e-4); }
.c-2 { grid-column: span 2; } .c-3 { grid-column: span 3; } .c-4 { grid-column: span 4; }
.c-5 { grid-column: span 5; } .c-6 { grid-column: span 6; } .c-8 { grid-column: span 8; }
.c-9 { grid-column: span 9; } .c-12 { grid-column: span 12; }
.c-1 { grid-column: span 1; } .c-7 { grid-column: span 7; } .c-10 { grid-column: span 10; }
/* Começa uma linha nova da grade sem perder a largura (ex.: o CEP abre o bloco de endereço). */
.c-1.nova-linha { grid-column: 1 / span 1; }
.c-2.nova-linha { grid-column: 1 / span 2; }
.c-3.nova-linha { grid-column: 1 / span 3; }
.c-4.nova-linha { grid-column: 1 / span 4; }
.c-5.nova-linha { grid-column: 1 / span 5; }
.c-6.nova-linha { grid-column: 1 / span 6; }
.c-7.nova-linha { grid-column: 1 / span 7; }
.c-8.nova-linha { grid-column: 1 / span 8; }
.c-9.nova-linha { grid-column: 1 / span 9; }
.c-10.nova-linha { grid-column: 1 / span 10; }
.c-12.nova-linha { grid-column: 1 / span 12; }
@media (max-width: 1023px) {
  .c-1.nova-linha { grid-column: 1 / span 4; }
  .c-2.nova-linha { grid-column: 1 / span 4; }
  .c-3.nova-linha { grid-column: 1 / span 4; }
  .c-4.nova-linha { grid-column: 1 / span 6; }
  .c-5.nova-linha { grid-column: 1 / span 6; }
  .c-6.nova-linha { grid-column: 1 / span 6; }
  .c-7.nova-linha { grid-column: 1 / span 12; }
  .c-8.nova-linha { grid-column: 1 / span 12; }
  .c-9.nova-linha { grid-column: 1 / span 12; }
  .c-10.nova-linha { grid-column: 1 / span 12; }
  .c-12.nova-linha { grid-column: 1 / span 12; }
}
@media (max-width: 599px) {
  .c-1.nova-linha { grid-column: 1 / span 6; }
  .c-2.nova-linha { grid-column: 1 / span 6; }
  .c-3.nova-linha { grid-column: 1 / span 6; }
  .c-4.nova-linha { grid-column: 1 / span 12; }
  .c-5.nova-linha { grid-column: 1 / span 12; }
  .c-6.nova-linha { grid-column: 1 / span 12; }
  .c-7.nova-linha { grid-column: 1 / span 12; }
  .c-8.nova-linha { grid-column: 1 / span 12; }
  .c-9.nova-linha { grid-column: 1 / span 12; }
  .c-10.nova-linha { grid-column: 1 / span 12; }
  .c-12.nova-linha { grid-column: 1 / span 12; }
}
/* Média: 2 e 3 colunas em trios; 4, 5 e 6 em pares; 8 e 9 na linha inteira. */
@media (max-width: 1023px) {
  .c-1, .c-2, .c-3 { grid-column: span 4; }
  .c-4, .c-5, .c-6 { grid-column: span 6; }
  .c-7, .c-8, .c-9, .c-10 { grid-column: span 12; }
}
/* Compacta: 2 e 3 colunas em pares; o resto na linha inteira. */
@media (max-width: 599px) {
  .grade { gap: var(--e-3); }
  .c-1, .c-2, .c-3 { grid-column: span 6; }
  .c-4, .c-5, .c-6, .c-7, .c-8, .c-9, .c-10 { grid-column: span 12; }
}

/* Mensagens de campo */
.campo-ajuda { font-size: var(--texto-rotulo); line-height: var(--linha-rotulo); color: var(--cor-texto-2); }
.campo-erro { font-size: var(--texto-rotulo); line-height: var(--linha-rotulo); color: var(--cor-atrasado); }
.campo[data-erro="sim"] input, .campo[data-erro="sim"] select { border-color: var(--cor-atrasado); }
.campo input:focus, .campo select:focus, .campo textarea:focus, .tabela-parcelas input:not([type="checkbox"]):focus, .tabela-leitura select:focus, .vinculos li > select:focus, select.seletor-compacto:focus, .ordem-docs .ordem-descricao:focus { outline: 2px solid var(--cor-marca); outline-offset: -1px; border-color: var(--cor-marca); }
.campo input[readonly] { background: var(--cor-superficie-2); color: var(--cor-texto-2); }

/* Foto de perfil (quadrada, cantos quase retos) */
.foto { display: inline-flex; align-items: center; justify-content: center; overflow: hidden; flex: none;
  background: var(--cor-superficie-2); border: 1px solid var(--cor-borda); border-radius: var(--raio-superficie);
  color: var(--cor-texto-2); font-weight: 600; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Tabelas */
.tabela { width: 100%; border-collapse: collapse; }
.tabela th { text-align: left; font-size: var(--texto-rotulo); line-height: var(--linha-rotulo); font-weight: 500; color: var(--cor-texto-2); padding: 12px var(--e-3); border-bottom: 1px solid var(--cor-borda); white-space: nowrap; }
.tabela td { height: 40px; padding: var(--e-2) var(--e-3); border-bottom: 1px solid var(--cor-borda); white-space: nowrap; }

/* Selos */
.selo { display: inline-flex; align-items: center; gap: var(--e-2); height: 24px; padding: 0 var(--e-2); border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); font-size: var(--texto-rotulo); font-weight: 500; }
.ponto { width: 8px; height: 8px; display: inline-block; }

/* Some em telas estreitas */
.so-largo { display: flex; }
@media (max-width: 599px) { .so-largo { display: none; } }

/* O atributo hidden sempre vence (inclusive sobre .botao) */
[hidden] { display: none !important; }

/* Diálogo modal */
.dialogo { padding: 0; border: 1px solid var(--cor-borda); border-radius: var(--raio-superficie);
  background: var(--cor-superficie); color: var(--cor-texto); width: min(354px, calc(100vw - 32px)); }
.dialogo::backdrop { background: rgb(0 0 0 / 0.55); }
.dialogo-rodape { display: flex; justify-content: flex-end; gap: var(--e-2); padding: var(--e-3); border-top: 1px solid var(--cor-borda); }

/* Recorte de foto */
.recorte { position: relative; overflow: hidden; touch-action: none; cursor: grab; user-select: none;
  background: var(--cor-superficie-2); border: 1px solid var(--cor-borda); max-width: 100%; }
.recorte:active { cursor: grabbing; }
.recorte:focus-visible { outline: 2px solid var(--cor-marca); outline-offset: 2px; }
.recorte img { position: absolute; left: 0; top: 0; max-width: none; pointer-events: none; }
input[type="range"] { accent-color: var(--cor-marca); width: 100%; }

/* Composição de páginas internas */
.pagina { width: 100%; max-width: 960px; margin: 0 auto; padding: var(--e-5) var(--margem-pagina) var(--e-6);
  display: flex; flex-direction: column; gap: var(--e-4); }
.pagina-titulo { display: flex; flex-direction: column; gap: var(--e-1); }
.pilha { display: flex; flex-direction: column; gap: var(--e-4); }
.cabecalho-linha { display: flex; align-items: center; justify-content: space-between; gap: var(--e-3); min-height: 56px; padding-top: 0; padding-bottom: 0; }
.foto-linha { display: flex; align-items: center; gap: var(--e-3); }
.foto-acoes { display: flex; flex-direction: column; align-items: flex-start; gap: var(--e-1); }
.barra-acoes { display: flex; align-items: center; gap: var(--e-3); flex-wrap: wrap; }

/* Tela de entrada */
.entrada { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--margem-pagina); }
.entrada .cartao { width: 100%; max-width: 432px; }   /* 400 de conteúdo + 2 × 16 */
.entrada .cartao-corpo { display: flex; flex-direction: column; gap: var(--e-3); }
.entrada-rodape { padding: var(--e-3); border-top: 1px solid var(--cor-borda); display: flex; justify-content: space-between; align-items: center; }
.carregando-botao { position: absolute; inset: 0; display: block; align-items: center; justify-content: center;
  border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); background: var(--cor-superficie-2);
  color: var(--cor-texto-2); font-size: 14px; }

/* Controle deslizante dentro de .campo: sem caixa de campo */
.campo input[type="range"] { height: 24px; padding: 0; border: none; background: none; }
.campo input[type="range"]:focus { outline: none; }
.campo input[type="range"]:focus-visible { outline: 2px solid var(--cor-marca); outline-offset: 2px; }

/* Lista ainda sem escolha: texto apagado, como um texto de exemplo */
.campo select:has(option[value=""]:checked) { color: var(--cor-texto-2); }
.campo select option { color: var(--cor-texto); }

/* Texto só para leitores de tela */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Moldura das telas internas: topo de 56 px, menu lateral de 240 px */
.moldura { min-height: 100vh; display: grid; grid-template-columns: 240px minmax(0, 1fr); grid-template-rows: 56px 1fr;
  grid-template-areas: "topo topo" "menu conteudo"; }
.moldura-topo { grid-area: topo; display: grid; grid-template-columns: 240px minmax(0, 1fr) auto; align-items: center;
  border-bottom: 1px solid var(--cor-borda); background: var(--cor-superficie); position: sticky; top: 0; z-index: 10; }
.moldura-marca { display: flex; align-items: center; height: 56px; padding: 0 var(--e-3); background: var(--cor-lateral);
  border-right: 1px solid var(--cor-lateral-borda); --cor-texto: var(--cor-lateral-texto); color: var(--cor-lateral-texto); text-decoration: none; }
.moldura-escritorio { padding: 0 var(--margem-pagina); min-width: 0; display: flex; align-items: center; gap: var(--e-3); }
.botao-voltar { display: inline-flex; align-items: center; gap: var(--e-1); flex: 0 0 auto; }
.moldura-escritorio > :not(.botao-voltar) { min-width: 0; }
.moldura-escritorio-nome { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.seletor-escritorio select { height: var(--altura-compacta); max-width: 100%; padding: 0 var(--e-2); font: inherit; font-weight: 600;
  border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); background: var(--cor-fundo); color: var(--cor-texto); }
.moldura-pessoa { display: flex; align-items: center; gap: var(--e-3); padding: 0 var(--margem-pagina) 0 0; }
.moldura-pessoa-link { display: flex; align-items: center; gap: var(--e-2); color: inherit; text-decoration: none; }
.moldura-pessoa-texto { flex-direction: column; line-height: 16px; font-size: 14px; font-weight: 500; }
.moldura-pessoa-texto .rotulo { font-weight: 400; }

.moldura-menu { grid-area: menu; background: var(--cor-lateral); border-right: 1px solid var(--cor-lateral-borda);
  display: flex; flex-direction: column; gap: var(--e-3); padding: var(--e-3) 0; position: sticky; top: 56px; height: calc(100vh - 56px); }
.moldura-menu ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.moldura-menu ul + ul { border-top: 1px solid var(--cor-lateral-borda); padding-top: var(--e-3); }
.menu-item { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 var(--e-3);
  color: var(--cor-lateral-texto); text-decoration: none; font-size: 14px; border-left: 2px solid transparent; }
.menu-item:hover { background: var(--cor-lateral-borda); }
.menu-item[aria-current="page"] { border-left-color: var(--cor-marca-lateral); background: var(--cor-lateral-borda); font-weight: 600; }
.menu-item[aria-disabled="true"] { color: var(--cor-lateral-texto-2); cursor: default; }
.menu-item[aria-disabled="true"]:hover { background: none; }
.menu-breve { font-size: 12px; line-height: 16px; color: var(--cor-lateral-texto-2); }
.moldura-tema { margin-top: auto; padding: 0 var(--e-3); }
.moldura-tema [role="group"] { border-color: var(--cor-lateral-borda) !important; }
.moldura-tema button { color: var(--cor-lateral-texto-2) !important; background: transparent !important; }
.moldura-tema button[aria-pressed="true"] { color: var(--cor-lateral-texto) !important; background: var(--cor-lateral-borda) !important; }
.moldura-conteudo { grid-area: conteudo; min-width: 0; }
/* Larguras de conteúdo: ficha/formulário 960, lista/painel 1280, texto corrido 720 (+ as margens laterais). */
/* Centralizadas na área ao lado do menu: em telas largas, as sobras ficam iguais dos dois lados (decidido em 08/11/2026). */
.moldura-conteudo .pagina { margin: 0 auto; max-width: calc(960px + 2 * var(--margem-pagina)); }
.moldura-conteudo .pagina-larga { max-width: calc(1280px + 2 * var(--margem-pagina)); }
.moldura-conteudo .pagina-texto { max-width: calc(720px + 2 * var(--margem-pagina)); }

@media (max-width: 1023px) {

/* Nuvem: conexão, trilha de pastas */
.linha-conexao { display: flex; align-items: center; justify-content: space-between; gap: var(--e-3); min-height: 48px; }
.trilha { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e-1); font-size: 14px; line-height: 24px; }
.trilha-item { border: 0; background: none; padding: 0; color: var(--cor-texto-2); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.trilha-item::after { content: "›"; margin-left: var(--e-1); text-decoration: none; display: inline-block; }
.trilha-atual { font-weight: 600; }
.item-pasta { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; font-weight: 500; }
.item-pasta:hover { text-decoration: underline; text-underline-offset: 3px; }
.envio { padding-top: var(--e-3); border-top: 1px solid var(--cor-borda); }

/* Permissões por cargo: quatro colunas no largo, uma no estreito */
.grade-cargos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--e-4); }
@media (max-width: 1023px) { .grade-cargos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 599px) { .grade-cargos { grid-template-columns: 1fr; } }
.cargo { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: var(--e-3); min-width: 0; }
.cargo-titulo { font-size: var(--texto-subtitulo); line-height: var(--linha-subtitulo); font-weight: 600; padding: 0; margin-bottom: var(--e-2); display: flex; align-items: center; }
.marcas { display: flex; flex-direction: column; }
.marcas .marcacao { min-height: 32px; }
.marcas-linha { flex-direction: row; flex-wrap: wrap; column-gap: var(--e-4); }
.topo-bloco { padding-top: var(--e-3); border-top: 1px solid var(--cor-borda); margin-bottom: 0; }

/* Prazos */
.botao-texto { background: none; border: 0; padding: 0; color: var(--cor-texto); text-decoration: underline; text-underline-offset: 3px; font: inherit; font-size: 14px; cursor: pointer; }
select.seletor-compacto, .seletor-compacto { height: 32px; max-width: 180px; font-size: 13px; padding: 0 8px !important; }
.linha-prazo { flex-wrap: wrap; padding: var(--e-2) 0; }
.selo-prazo { margin-left: var(--e-2); height: 20px; padding: 0 var(--e-1); vertical-align: 1px; }
.selo-prazo.prazo-vencido, .selo-prazo.prazo-hoje { border-color: var(--cor-atrasado); color: var(--cor-atrasado); }
.selo-prazo.prazo-interno, .selo-prazo.prazo-semana { border-color: var(--cor-vence-breve); color: var(--cor-vence-breve); }
.passos-prazo { margin: var(--e-2) 0 0; padding-left: var(--e-4); font-size: 13px; line-height: 20px; color: var(--cor-texto-2, inherit); }
.passos-prazo li { margin: 0; }
.previa-prazo { padding: var(--e-3); background: var(--cor-superficie-2); border-left: 2px solid var(--cor-marca); }
.previa-resultado { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--e-2) var(--e-3); margin: 0; }
.previa-resultado strong { font-size: 16px; }
.linha-encerrar { display: flex; gap: var(--e-2); margin-top: var(--e-2); }
.linha-encerrar input { flex: 1; min-width: 0; height: 32px; }
.calendario-mes { margin: 0; }
.vinculos .passos-prazo li { display: list-item; min-height: 0; border: 0; }
.linha-prazo .opcao-texto .secundario { white-space: normal; overflow: visible; text-overflow: clip; }
.titulo-tarefa { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.titulo-tarefa:hover { text-decoration: underline; text-underline-offset: 3px; }
.detalhe-tarefa { display: flex; flex-direction: column; gap: var(--e-2); margin-top: var(--e-2); }
.texto-livre { white-space: pre-wrap; font-size: 14px; line-height: 20px; }
.filtro-pessoas { margin-bottom: var(--e-3); flex-wrap: wrap; }
.selo-tipo { min-width: 104px; justify-content: center; height: 22px; font-size: 12px; flex-shrink: 0; }
.revisao-nota { margin-top: 0; min-width: 320px; }
.item-importacao { display: block; padding: var(--e-3) 0; }
.item-importacao .grade { row-gap: var(--e-2); }
.item-ignorado { opacity: 0.55; }
.rodape-importacao { position: sticky; bottom: 0; padding: var(--e-3) 0; background: var(--cor-fundo); border-top: 1px solid var(--cor-borda); }
.leitura-docs select { height: 32px; max-width: 100%; }
.tabela-leitura { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela-leitura th, .tabela-leitura td { text-align: left; padding: var(--e-1) var(--e-2); border-bottom: 1px solid var(--cor-borda); vertical-align: top; }
.tabela-leitura th { font-size: var(--texto-rotulo); font-weight: 600; }
.tabela-leitura td:first-child { width: 32px; }

.importar-pdf .tabela-leitura .parte-nome { min-width: 16rem; }
.importar-pdf .c-12:has(> .tabela-leitura) { overflow-x: auto; }

/* DOCUMENTOS: ordem dos anexos numerados */
.ordem-docs li { padding: var(--e-1) 0; display: flex; flex-wrap: wrap; gap: var(--e-1) var(--e-2); align-items: center; }
.ordem-docs .ordem-rotulo { width: 6.5rem; white-space: nowrap; }
.ordem-docs .ordem-descricao { flex: 1 1 16rem; min-width: 0; }
.ordem-docs .ordem-comp { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; font-size: var(--texto-rotulo); }
.ordem-docs li .botao-compacto { min-width: 40px; width: 40px; padding-inline: 0; }
.documentos-numerados .nota-finalidade { display: flex; flex-direction: column; gap: var(--e-1); }
.documentos-numerados .nota-finalidade .barra-acoes { margin-top: var(--e-1); }
.tabela-leitura select { width: 100%; }
@media (max-width: 599px) {
  .ordem-docs .ordem-descricao { order: 9; flex-basis: 100%; }
  .ordem-docs .ordem-rotulo { flex: 1; }
}
.ordem-docs input[type="checkbox"] { accent-color: var(--cor-marca); }

/* Organização das pastas */
.tabela-organizar td { word-break: break-word; }
.tabela-organizar tr.op-duvidosa td:first-child { box-shadow: inset 3px 0 0 var(--cor-marca); padding-left: var(--e-2); }
.organizar-pasta .opcao-linha { display: inline-flex; gap: 6px; align-items: center; }
.organizar-pasta .opcao-linha input, .tabela-organizar input[type="checkbox"] { accent-color: var(--cor-marca); }
.organizar-pasta .pilha-curta { overflow-x: auto; }

/* Exclusão com código */
.botao-perigo { border-color: var(--cor-atrasado); color: var(--cor-atrasado); background: transparent; }
.botao-perigo:hover:not(:disabled) { background: var(--cor-atrasado); color: #fff; }
.zona-exclusao { border-color: color-mix(in srgb, var(--cor-atrasado) 45%, var(--cor-borda)); }
.zona-exclusao h3 { margin-bottom: var(--e-1); }
.dialogo-exclusao { width: min(480px, calc(100vw - 32px)); }
.dialogo-exclusao .dialogo-corpo { padding: var(--e-3); }
.codigo-exclusao { font-size: 28px; letter-spacing: 0.3em; text-align: center; padding: var(--e-2); border: 1px dashed var(--cor-borda); background: var(--cor-superficie-2); user-select: none; margin: 0; }
.lista-exclusao { margin: 0; padding-left: var(--e-3); max-height: 160px; overflow-y: auto; }

.vinculos li > select { height: var(--altura-compacta); padding: 0 8px; font-size: 13px; max-width: 220px; }
.cabecalho-acoes { flex-wrap: nowrap; white-space: nowrap; }

/* Audiências e reuniões */
.opcao-linha { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
.opcao-linha input[type="checkbox"], .opcao-linha input[type="radio"] { accent-color: var(--cor-marca); }
.vinculos li.linha-pendente { box-shadow: inset 3px 0 0 var(--cor-vence-breve); padding-left: var(--e-2); }
.convite-texto { white-space: pre-wrap; font-size: 14px; padding: var(--e-2); border: 1px dashed var(--cor-borda); background: var(--cor-superficie-2); margin: 0; }

/* Agenda */
.ag-barra { flex-wrap: wrap; gap: var(--e-2); }
.ag-titulo { font-size: 18px; margin: 0; }
.ag-filtros { flex-wrap: wrap; }
.chip-filtro { height: 32px; padding: 0 12px; border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); background: transparent; color: var(--cor-texto-2); font: inherit; font-size: 13px; cursor: pointer; }
.chip-filtro.ativo { color: var(--cor-texto); border-color: var(--cor-marca); background: var(--cor-marca-suave); }
.ag-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ag-item a, .ag-item .evento-botao { width: 100%; text-align: left; border-top: 0; border-right: 0; border-bottom: 0; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-left: 3px solid var(--ag-cor, var(--cor-borda)); background: var(--cor-superficie-2); color: var(--cor-texto); text-decoration: none; font-size: 13px; line-height: 1.35; }
.ag-item a:hover, .ag-item .evento-botao:hover { background: var(--cor-marca-suave); }
.ag-linha1 { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.ag-hora { font-weight: 600; }
.ag-tipo { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--cor-texto-2); white-space: nowrap; }
.ag-texto { overflow: hidden; text-overflow: ellipsis; }
.ag-detalhe { font-size: 12px; }
.ag-atrasado a { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cor-atrasado) 40%, transparent); }
.ag-audiencia { --ag-cor: var(--cor-marca); }
.ag-reuniao { --ag-cor: #6f7f99; }
.ag-prazo { --ag-cor: var(--cor-atrasado); }
.ag-interno { --ag-cor: var(--cor-vence-breve); }
.ag-tarefa { --ag-cor: var(--cor-confirmacao); }
.ag-revisao { --ag-cor: var(--cor-texto-2); }
.ag-cabeca { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--cor-texto-2); text-decoration: none; padding-bottom: 4px; }
.ag-hoje > .ag-cabeca { color: var(--cor-texto); font-weight: 700; }
.ag-semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--cor-borda); }
.ag-coluna { min-height: 220px; padding: var(--e-2); border-right: 1px solid var(--cor-borda); display: flex; flex-direction: column; gap: 4px; }
.ag-coluna:last-child { border-right: 0; }
.ag-coluna.ag-hoje { background: var(--cor-marca-suave); }
.ag-coluna .ag-item a, .ag-coluna .ag-item .evento-botao { font-size: 12px; }
.ag-mes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.ag-mes-semana { padding: 6px var(--e-2); font-size: 12px; color: var(--cor-texto-2); border-bottom: 1px solid var(--cor-borda); }
.ag-celula { min-height: 110px; padding: 6px; border-right: 1px solid var(--cor-borda); border-bottom: 1px solid var(--cor-borda); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ag-celula:nth-child(7n) { border-right: 0; }
.ag-celula.ag-fora { background: var(--cor-fundo); }
.ag-celula.ag-fora .ag-cabeca { opacity: 0.5; }
.ag-celula.ag-hoje { background: var(--cor-marca-suave); }
.ag-celula .ag-item a, .ag-celula .ag-item .evento-botao { padding: 2px 6px; font-size: 11px; }
.ag-celula .ag-tipo { display: none; }
@media (max-width: 1023px) {
  .ag-semana { grid-template-columns: 1fr; }
  .ag-coluna { min-height: 0; border-right: 0; border-bottom: 1px solid var(--cor-borda); }
  .ag-mes .ag-item, .ag-mes .ag-celula > .campo-ajuda { display: none; }
  .ag-celula { min-height: 48px; }
  .ag-celula:has(.ag-item) .ag-cabeca::after { content: "•"; color: var(--cor-marca); }
}
.lista-compromissos li { flex-wrap: wrap; gap: var(--e-1) var(--e-2); padding: var(--e-1) 0; }
.lista-compromissos .vinculo-nome { flex: 1 1 280px; }
.lista-compromissos .opcao-texto .secundario { white-space: normal; overflow: visible; }
@media (max-width: 599px) {
  .lista-compromissos li .botao-compacto { min-width: 0; flex: 1 1 auto; }
  .cabecalho-acoes > .campo-ajuda { display: none; }
}
.ag-visoes { flex-direction: row !important; width: fit-content !important; }
.ag-visoes a { border-top: 0 !important; height: 36px; }
.ag-visoes a + a { border-left: 1px solid var(--cor-borda) !important; }
.rolagem-tabela { overflow-x: auto; } .tabela-leitura input[type="checkbox"] { accent-color: var(--cor-marca); }

/* Seções recolhíveis (clicar no título); o app lembra como a pessoa deixou */
.cabecalho-recolhivel { cursor: pointer; user-select: none; }
.cabecalho-recolhivel h3 { display: flex; width: fit-content; max-width: 100%; align-items: center; gap: 8px; }
.cabecalho-recolhivel h3::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--cor-texto-2); border-bottom: 2px solid var(--cor-texto-2); transform: rotate(45deg); transition: transform 0.15s; margin-top: -3px; }
.cartao.recolhida > .cabecalho-recolhivel h3::before { transform: rotate(-45deg); margin-top: 0; }
.cartao.recolhida > :not(.cartao-cabecalho) { display: none !important; }
.cartao.recolhida > .cartao-cabecalho { border-bottom: 0; }
/* Na grade, o cartão recolhido não se estica até a altura do vizinho (se a linha ficar mista, ele fica só com o cabeçalho). */
.grade > .cartao.recolhida { align-self: start; }
.cabecalho-recolhivel h3:focus-visible { outline: 2px solid var(--cor-marca); outline-offset: 2px; }

/* Mesclar cadastros duplicados */
.lista-duplicados { list-style: none; margin: 0; padding: 0; }
.lista-duplicados li { display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--e-3); align-items: start; padding: var(--e-3) 0; border-bottom: 1px solid var(--cor-borda); }
.lista-duplicados li:last-child { border-bottom: 0; }
.lista-duplicados-acao { align-items: flex-end; text-align: right; }
.mescla-lados { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e-3); }
.mescla-lado { display: flex; gap: var(--e-2); align-items: flex-start; padding: var(--e-3); border: 1px solid var(--cor-borda); border-radius: 4px; cursor: pointer; }
.mescla-lado.mescla-fica { border-color: var(--cor-marca); outline: 1px solid var(--cor-marca); outline-offset: -2px; }
.mescla-lado input { margin-top: 4px; }
.mescla-campo { border: 0; border-top: 1px solid var(--cor-borda); margin: 0; padding: var(--e-2) 0 0; display: grid; gap: 4px; }
.mescla-campo legend { padding: 0; float: left; width: 100%; margin-bottom: 4px; }
.mescla-campo .opcao-linha span { white-space: pre-wrap; overflow-wrap: anywhere; }
.mescla-iguais { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--e-3); margin: var(--e-2) 0 0; }
.mescla-iguais > div { display: contents; }
.mescla-iguais dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 599px) {
  .lista-duplicados li, .mescla-lados { grid-template-columns: 1fr; }
  .lista-duplicados-acao { align-items: flex-start; text-align: left; }
}
.mescla-campo .opcao-linha { display: flex; align-items: flex-start; }
.mescla-campo .opcao-linha input { margin-top: 4px; }
.mescla-lado input { accent-color: var(--cor-marca); }

/* Outros, advogados, partes e contatos */
.botoes-contato { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.etiquetas { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.etiqueta { font-size: 12px; line-height: 16px; padding: 0 4px; border: 1px solid var(--cor-borda); border-radius: 2px; background: var(--cor-superficie-2); color: var(--cor-texto-2); text-decoration: none; }
.selo-mini { font-size: 12px; line-height: 16px; padding: 0 4px; margin-left: 8px; border-radius: 2px; border: 1px solid var(--cor-borda); color: var(--cor-texto-2); vertical-align: middle; }
.lista-partes > li.parte-linha { display: block; }
.parte-topo { display: flex; gap: var(--e-2); align-items: center; flex-wrap: wrap; }
.parte-topo .vinculo-nome { flex: 1 1 240px; min-width: 0; }
.parte-advogados { margin: var(--e-2) 0 0 var(--e-3); padding-left: var(--e-3); border-left: 2px solid var(--cor-borda); }
.parte-nova { border-top: 1px solid var(--cor-borda); padding-top: var(--e-3); }
.alinhar-base { align-self: end; }
.vinculos li .parte-topo .botao-compacto, .vinculos li .botoes-contato .botao-compacto, .botoes-contato .botao-compacto { min-width: 0; padding-left: 8px; padding-right: 8px; }
.parte-topo select.seletor-compacto { width: 192px; max-width: 100%; }

/* Paginação */
.paginacao { display: flex; align-items: center; justify-content: space-between; gap: var(--e-2); flex-wrap: wrap; padding: var(--e-2) var(--e-3); border-top: 1px solid var(--cor-borda); }
.paginacao-paginas { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.paginacao .botao-compacto { min-width: 32px; padding: 0 8px; justify-content: center; }
.paginacao .botao[aria-current="page"] { border-color: var(--cor-texto); font-weight: 600; }
.paginacao .botao[aria-disabled="true"] { opacity: .4; pointer-events: none; }
.campo-estreito { max-width: 120px; }
.paginacao-embutida { padding: var(--e-2) 0 0; }

/* Janela do evento (agenda, painel, tarefas) */
.dialogo-evento { width: min(480px, calc(100vw - 32px)); }
.dialogo-evento h3 { margin: 0; }
.evento-info { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--e-3); margin: 0; }
.evento-info > div { display: contents; }
.evento-info dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.evento-botao { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.evento-botao:focus-visible { outline: 2px solid var(--cor-marca); outline-offset: 2px; }
@media (max-width: 599px) { .evento-info { grid-template-columns: 1fr; } .evento-info dt { margin-top: 4px; } }
.evento-link { color: var(--cor-texto); text-decoration: underline; text-underline-offset: 2px; }

/* Guia de primeiros passos e "Mostrar na tela" */
.guia-destaque { outline: 2px solid var(--cor-marca) !important; outline-offset: 4px; border-radius: 2px; }
.guia-cartao { position: fixed; right: 24px; bottom: 24px; z-index: 60; width: min(360px, calc(100vw - 32px)); display: grid; gap: var(--e-2);
  padding: var(--e-3); background: var(--cor-superficie); color: var(--cor-texto); border: 1px solid var(--cor-marca); border-radius: 4px; }
.guia-cartao h3, .guia-cartao p { margin: 0; }
.guia-cartao .guia-proximo { border-color: var(--cor-marca); }
@media (max-width: 599px) { .guia-cartao { right: 16px; left: 16px; bottom: 16px; width: auto; } }
.botao-ajuda { width: 32px; min-width: 32px; padding: 0; justify-content: center; font-weight: 600; }

/* Manual */
.manual { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: var(--e-4, 24px); align-items: start; }
.manual-indice { position: sticky; top: 16px; }
.manual-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.manual-item { width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 4px 8px; font: inherit; color: var(--cor-texto); cursor: pointer; }
.manual-item:hover { background: var(--cor-superficie-2); }
.manual-item[aria-current="true"] { border-left-color: var(--cor-marca); background: var(--cor-superficie-2); font-weight: 600; }
.manual-passos { margin: 0; padding-left: 24px; display: grid; gap: var(--e-2); }
.manual-passos li { display: flex; gap: var(--e-2); align-items: flex-start; justify-content: space-between; }
.manual-passos li .marcacao { align-items: flex-start; }
.manual-passos li.feito span { color: var(--cor-texto-2); text-decoration: line-through; }
.manual-dicas { margin: 0; padding-left: 16px; }
.manual-navegar { justify-content: space-between; border-top: 1px solid var(--cor-borda); padding-top: var(--e-3); }
@media (max-width: 1023px) { .manual { grid-template-columns: 1fr; } .manual-indice { position: static; } .manual-passos li { flex-direction: column; } }
@media (max-width: 1023px) { .manual-capitulo { order: -1; } }

/* Janela (popup) padrão */
.janela { padding: 0; }
.janela-pequena { width: min(400px, calc(100vw - 32px)); }
.janela-media { width: min(640px, calc(100vw - 32px)); }
.janela-grande { width: min(960px, calc(100vw - 32px)); }
.janela[open] { display: flex; flex-direction: column; max-height: calc(100dvh - 32px); }
.janela-cabecalho { display: flex; align-items: center; justify-content: space-between; gap: var(--e-3); padding: var(--e-3); border-bottom: 1px solid var(--cor-borda); }
.janela-cabecalho h3 { margin: 0; }
.janela-fechar { min-width: 32px; width: 32px; padding: 0; justify-content: center; font-size: 18px; }
.janela-corpo { padding: var(--e-3); overflow: auto; }
.janela-corpo > .cartao { border: 0; }
.janela-corpo .grade { padding: 0; }

/* Abas da página */
/* Linha das abas (19/11/2026): fica presa no alto ao rolar, com o disquete do salvar automático no canto direito;
   da linha à primeira seção, 16 px (o que a aba contém vira dica ao passar o mouse). */
.abas-barra { display: flex; gap: 0; border-bottom: 1px solid var(--cor-borda); overflow-x: auto; margin-bottom: var(--e-3);
  position: sticky; top: 56px; z-index: 6; background: var(--cor-fundo); scrollbar-width: none; }
.abas-barra::-webkit-scrollbar { display: none; }
.abas-salvar { margin-left: auto; position: sticky; right: 0; display: inline-flex; align-items: center; padding: 0 var(--e-2) 0 var(--e-3); background: var(--cor-fundo); }
.icone-salvar { display: inline-flex; align-items: center; gap: var(--e-1); height: 24px; color: var(--cor-texto-3, var(--cor-texto-2)); font-size: var(--texto-rotulo); line-height: 16px; white-space: nowrap; cursor: default; }
.icone-salvar[data-estado="salvando"] > svg:first-child, .icone-salvar[data-estado="pendente"] > svg:first-child { color: var(--cor-texto); animation: disquete-pulsa 1.2s ease-in-out infinite; }
.icone-salvar[data-estado="salvo"] { color: var(--cor-texto-2); }
.icone-salvar[data-estado="erro"] { color: var(--cor-atrasado); }
.icone-salvar-pontos { display: inline-flex; gap: 2px; }
.icone-salvar-pontos > i { width: 3px; height: 3px; background: currentColor; animation: disquete-pulsa 1.2s ease-in-out infinite; }
.icone-salvar-pontos > i:nth-child(2) { animation-delay: .2s; } .icone-salvar-pontos > i:nth-child(3) { animation-delay: .4s; }
.icone-salvar-tique { color: var(--cor-marca); }
.icone-salvar-texto { max-width: 40ch; overflow: hidden; text-overflow: ellipsis; }
@keyframes disquete-pulsa { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .icone-salvar svg, .icone-salvar-pontos > i { animation: none !important; } }
.barra-salvar:empty, .alinha-campo:empty { display: none; }
.abas-botao { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 16px; font: inherit; font-weight: 500; color: var(--cor-texto-2); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.abas-botao[aria-selected="true"] { color: var(--cor-texto); border-bottom-color: var(--cor-marca); }
.abas-botao:focus-visible { outline: 2px solid var(--cor-marca); outline-offset: -2px; }
.abas-contagem { font-size: 12px; line-height: 16px; padding: 0 4px; border: 1px solid var(--cor-borda); border-radius: 2px; color: var(--cor-texto-2); }
.abas-alerta { border-color: var(--cor-atrasado); color: var(--cor-atrasado); }
.painel-aba { display: none; }

.abas-pagina[data-aba-ativa="resumo"] > .painel-aba[data-aba-painel="resumo"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="arquivos"] > .painel-aba[data-aba-painel="arquivos"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="dados"] > .painel-aba[data-aba-painel="dados"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="financeiro"] > .painel-aba[data-aba-painel="financeiro"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="historico"] > .painel-aba[data-aba-painel="historico"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="cadastro"] > .painel-aba[data-aba-painel="cadastro"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="demandas"] > .painel-aba[data-aba-painel="demandas"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="andamento"] > .painel-aba[data-aba-painel="andamento"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="tarefas"] > .painel-aba[data-aba-painel="tarefas"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="processo"] > .painel-aba[data-aba-painel="processo"] { display: flex; flex-direction: column; }
.abas-pagina[data-aba-ativa="escritorio"] > .painel-aba[data-aba-painel="escritorio"] { display: flex; flex-direction: column; }
.mescla-itens { margin: 0; padding-left: 16px; font-size: 13px; color: var(--cor-texto-2); }

/* Topo da demanda: identificação, selos, partes e ações rápidas */
.topo-demanda { margin-bottom: var(--e-2); }
.topo-linha { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--e-3); flex-wrap: wrap; }
.topo-titulo { min-width: 0; flex: 1 1 360px; }
.topo-titulo h1 { margin: 0; }
.topo-selos { display: flex; gap: var(--e-2); flex-wrap: wrap; }
.selo-botao { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 4px 8px; border: 1px solid var(--cor-borda); border-radius: 2px; background: var(--cor-superficie); color: var(--cor-texto); font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
.selo-botao:hover { border-color: var(--cor-texto-2); }
.topo-selos .selo { display: inline-flex; flex-direction: column; align-items: flex-start; padding: 4px 8px; height: auto; }
.topo-partes { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--e-2) var(--e-3); padding: var(--e-3); border: 1px solid var(--cor-borda); border-radius: 4px; background: var(--cor-superficie); }
.topo-polo { display: grid; gap: 4px; align-content: start; }
.topo-polo ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.topo-polo li { display: grid; gap: 0; }
.topo-parte-figura { font-size: 12px; line-height: 16px; color: var(--cor-texto-2); }
.topo-parte-nome { font-weight: 600; }
.topo-parte-adv { font-size: 13px; }
.topo-versus { align-self: center; color: var(--cor-texto-2); font-size: 18px; }
.topo-outros, .topo-sem-figura { grid-column: 1 / -1; border-top: 1px solid var(--cor-borda); padding-top: var(--e-2); margin: 0; }
.topo-acoes { gap: var(--e-2); }
.lista-opcoes { display: grid; gap: 8px; }
.lista-proximos .selo-tipo { min-width: 96px; justify-content: center; }
@media (max-width: 599px) {
  .topo-partes { grid-template-columns: 1fr; }
  .topo-versus { display: none; }
  .topo-acoes .botao-compacto { flex: 1 1 30%; }
}

.linha-representacao { margin-top: 4px; }

.topo-partes-cabecalho { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; margin: 0; }
.botao-link { background: none; border: 0; padding: 0; color: var(--cor-texto-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; font-size: 13px; }
.botao-link:hover { color: var(--cor-texto); }
.topo-titulo .topo-selos { margin-top: var(--e-2); }

/* Conferência “Hoje no app × Lido no PDF” */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.tabela-conferir { width: 100%; }
.tabela-conferir td { vertical-align: top; padding-top: 8px; padding-bottom: 8px; white-space: normal; overflow-wrap: anywhere; }
.tabela-conferir .col-marca { width: 40px; text-align: center; }
.tabela-conferir select, .tabela-conferir input:not([type="checkbox"]) { width: 100%; }
.barra-dados { display: flex; justify-content: flex-end; margin-bottom: var(--e-3); }
.aviso-atencao { color: var(--cor-vence-breve); font-size: 14px; line-height: 24px; margin: 0; }
.estimativa-valor { font-size: 24px; line-height: 32px; font-weight: 600; margin: 0; }
/* Celular: a barra de ações do cabeçalho ocupa a largura toda (botões um embaixo do outro, o principal em cima). */
@media (max-width: 599px) {
  .topo-linha > .barra-acoes, .cabecalho-pagina > .barra-acoes { flex: 1 1 100%; width: 100%; }
}
/* Utilitários de texto (no lugar de estilos soltos nas telas) */
.texto-corpo { font-size: var(--texto-corpo); line-height: var(--linha-corpo); }
.texto-confirmacao { color: var(--cor-confirmacao); }
.texto-atencao { color: var(--cor-vence-breve); font-weight: 500; }
.texto-urgente { color: var(--cor-atrasado); font-weight: 500; }
.largura-total { width: 100%; }
/* Janelas: a barra que conclui fica à direita, com o botão principal por último (mais à direita) e Cancelar antes dele. */
.janela-corpo .barra-acoes:has(> .botao-principal) { flex-direction: row-reverse; justify-content: flex-start; }
/* Botão só com ícone (o “+” das ações menos usadas): quadrado de 40 px */
.botao-icone { width: var(--altura-padrao); min-width: var(--altura-padrao); padding: 0; justify-content: center; }
@media (max-width: 599px) { .barra-acoes > .botao-icone { flex: 0 0 var(--altura-padrao); } }

/* Listas que se adaptam à tela (Regramento › Tabelas): colunas por prioridade e condensação na primeira coluna. */
.botao-icone-compacto { width: var(--altura-compacta); min-width: var(--altura-compacta) !important; padding: 0 !important; justify-content: center; }
.botoes-contato { flex-wrap: nowrap; }
.col-ampla { }
@media (max-width: 1439px) { .col-ampla { display: none; } }
@media (max-width: 1023px) { .col-media { display: none; } }
.condensado { display: none; }
@media (max-width: 1023px) { .condensado-media { display: block; } }
@media (max-width: 599px) { .condensado-compacta { display: block; } }
.tabela .col-acoes { width: 1%; text-align: right; }
/* Celular: no cabeçalho, o botão principal ocupa o espaço e o “+” fica ao lado, na mesma linha. */
@media (max-width: 599px) {
  .cabecalho-pagina > .barra-acoes, .topo-linha > .barra-acoes { flex-wrap: nowrap; }
  .cabecalho-pagina > .barra-acoes > .botao:not(.botao-icone), .topo-linha > .barra-acoes > .menu-suspenso-texto { flex: 1 1 auto; }
  .celula-dupla, .tabela td.celula-dupla { min-width: 0; }
}
/* Checklist da tarefa: caixa, texto e retirar, em linhas de 40 px */
.checklist-edicao { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--e-2); }
.checklist-edicao li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: var(--e-2); }
.checklist-edicao input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--cor-marca); }
.checklist-edicao input:not([type="checkbox"]) { height: var(--altura-padrao); padding: 0 12px; border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); background: var(--cor-fundo); color: var(--cor-texto); font: inherit; }
.alinhar-inicio { align-self: flex-start; }
.autoria { margin: 0; }
.barra-final { justify-content: flex-end; }
/* Movimentações: data à esquerda (coluna fixa), tipo e descrição, ação à direita */
.movimentacoes { list-style: none; margin: 0; padding: 0; display: grid; }
.movimentacoes li { display: grid; grid-template-columns: 136px minmax(0, 1fr) auto; gap: var(--e-3); padding: var(--e-2) 0; border-bottom: 1px solid var(--cor-borda); align-items: start; }
.movimentacoes li:last-child { border-bottom: 0; }
.mov-data { color: var(--cor-texto-2); font-size: 13px; line-height: 24px; }
.mov-corpo { display: grid; gap: 0; min-width: 0; }
.mov-tipo { font-weight: 500; }
.mov-descricao { white-space: pre-line; }
.mov-acoes { line-height: 24px; display: flex; gap: var(--e-3); }
@media (max-width: 599px) { .movimentacoes li { grid-template-columns: minmax(0, 1fr); } .mov-data { grid-column: 1 / -1; } .movimentacoes .mov-acoes { flex-wrap: wrap; padding-top: var(--e-1); } }
.atalhos { display: grid; gap: var(--e-1); }
.atalhos-lista { display: flex; flex-wrap: wrap; gap: var(--e-2); }
.botao.ativo { border-color: var(--cor-marca); background: var(--cor-marca-suave); }
/* Celular: no cabeçalho de cartão, contagem e botão compacto continuam na mesma linha do título quando cabem. */
@media (max-width: 599px) {
  .cartao-cabecalho .barra-acoes { flex-wrap: nowrap; gap: var(--e-2); }
  .cartao-cabecalho .barra-acoes > .botao { flex: 0 0 auto; }
  .movimentacoes li { row-gap: 0; }
}

/* Configurações › Notificações */
.lista-avisos { list-style: none; margin: 0; padding: 0; }
.lista-avisos li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--e-4); align-items: center; padding: var(--e-2) 0; border-top: 1px solid var(--cor-borda); }
.lista-avisos li:first-child { border-top: 0; }
.lista-avisos .campo-dias { width: 160px; }
@media (max-width: 599px) { .lista-avisos li { grid-template-columns: 1fr; gap: var(--e-2); } }

/* Avisar o cliente */
.previa-mensagem { margin: 0; padding: var(--e-3) var(--e-4); border: 1px solid var(--cor-borda); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 24px; }
.avisos-recentes { margin: 0; padding: 0; list-style: none; }
.avisos-recentes li { padding: var(--e-1) 0; border-top: 1px solid var(--cor-borda); }
.lista-revisao li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--e-3); align-items: start; }
.lista-revisao li > input[type="checkbox"] { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--cor-marca); }

/* Visualizador de PDF */
.janela-tela { width: min(1400px, calc(100vw - 32px)); height: calc(100dvh - 32px); }
.janela-tela .janela-corpo { flex: 1; min-height: 0; padding: 0; display: flex; flex-direction: column; }
.visualizador { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.visualizador-barra { display: flex; flex-wrap: wrap; gap: var(--e-2) var(--e-3); align-items: center; justify-content: space-between; padding: var(--e-2) var(--e-3); border-bottom: 1px solid var(--cor-borda); }
.visualizador-ir input { width: 96px; height: 32px; }
.visualizador-area { flex: 1; min-height: 0; overflow: auto; background: var(--cor-superficie-2); padding: var(--e-3); display: flex; flex-direction: column; align-items: center; gap: var(--e-3); }
.visualizador-pagina { position: relative; background: #fff; box-shadow: 0 0 0 1px var(--cor-borda); flex: none; }
.visualizador-pagina canvas { display: block; }
.visualizador-numero { position: absolute; right: -40px; top: 0; font-size: 12px; color: var(--cor-texto-2); }
@media (max-width: 599px) { .visualizador-numero { display: none; } .visualizador-area { padding: var(--e-2); } }
.textLayer { position: absolute; text-align: initial; inset: 0; overflow: clip; opacity: 1; line-height: 1; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; z-index: 0; }
.textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
.textLayer span.markedContent { top: 0; height: 0; }
.textLayer ::selection { background: rgba(184, 150, 46, 0.35); }
.textLayer br::selection { background: transparent; }
.textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: -1; cursor: default; user-select: none; }
.textLayer.selecting .endOfContent { top: 0; }
.janela-aviso { padding: var(--e-3); }
.visualizador-imagem { max-width: 100%; height: auto; background: #fff; }
.visualizador-texto { margin: 0; padding: var(--e-3); overflow: auto; flex: 1; white-space: pre-wrap; font-family: var(--fonte-numero, ui-monospace, monospace); font-size: 14px; }

/* Ver processo na íntegra: sumário dos autos + leitor */
.autos { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: var(--e-3); height: calc(100dvh - 200px); min-height: 480px; }
.autos-sumario { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.autos-sumario-topo { padding: var(--e-3); border-bottom: 1px solid var(--cor-borda); }
.autos-lista { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; }
.autos-item { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: var(--e-2) var(--e-3); border: 0; border-bottom: 1px solid var(--cor-borda); background: none; color: inherit; font: inherit; cursor: pointer; }
.autos-item:hover { background: var(--cor-superficie-2); }
.autos-item[aria-current="true"] { background: var(--cor-superficie-2); box-shadow: inset 3px 0 0 var(--cor-texto); }
.autos-item .secundario { font-size: 13px; }
.autos-nome { overflow-wrap: anywhere; }
.autos-leitor { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
@media (max-width: 899px) {
  .autos { grid-template-columns: 1fr; height: auto; }
  .autos-sumario { max-height: 40dvh; }
  .autos-leitor { height: 80dvh; }
}
@media (max-width: 599px) {
  .visualizador-barra .barra-acoes { gap: var(--e-2); width: 100%; }
  .visualizador-barra .barra-acoes > .botao { flex: 1 1 auto; }
}

/* Marcações nos autos */
.visualizador-area { position: relative; }
.marca-cor-amarelo { --cor-marcacao: #f2c500; }
.marca-cor-verde { --cor-marcacao: #3fae5f; }
.marca-cor-azul { --cor-marcacao: #3f8fe0; }
.marca-cor-rosa { --cor-marcacao: #e0609a; }
.marca-cor-laranja { --cor-marcacao: #ef8a2c; }
.marcas-pdf { position: absolute; inset: 0; pointer-events: none; }
.marca { position: absolute; }
.marca-destaque, .marca-comentario { background: var(--cor-marcacao); opacity: 0.38; mix-blend-mode: multiply; }
.marca-comentario { opacity: 0.22; border-bottom: 2px dotted var(--cor-marcacao); }
.marca-sublinhado { border-bottom: 2px solid var(--cor-marcacao); }
.marca-tachado { background: linear-gradient(transparent calc(50% - 1px), var(--cor-marcacao) calc(50% - 1px), var(--cor-marcacao) calc(50% + 1px), transparent calc(50% + 1px)); }
.marca-pino { position: absolute; right: 4px; width: 12px; height: 12px; border-radius: 2px 2px 2px 0; background: var(--cor-marcacao); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25); }
.marca-fita { position: absolute; top: 0; right: 24px; width: 14px; height: 28px; background: var(--cor-marcacao); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); z-index: 1; }
.marcar-barra { position: absolute; z-index: 5; display: flex; flex-direction: column; gap: var(--e-2); padding: var(--e-2); width: 300px; max-width: calc(100% - 16px);
  background: var(--cor-superficie); color: var(--cor-texto); border: 1px solid var(--cor-borda); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
.marcar-cores { display: flex; gap: var(--e-2); }
.marcar-cor { width: 28px; height: 28px; border: 1px solid var(--cor-borda); background: var(--cor-marcacao); cursor: pointer; padding: 0; }
.marcar-cor[aria-checked="true"] { outline: 2px solid var(--cor-texto); outline-offset: 2px; }
.marcar-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e-2); }
.marcar-comentario { display: flex; flex-direction: column; gap: var(--e-2); }
.marcar-barra textarea { width: 100%; resize: vertical; }
.marca-detalhe-topo { display: flex; justify-content: space-between; align-items: center; margin: 0; }
.marca-amostra { display: inline-block; width: 12px; height: 12px; background: var(--cor-marcacao); vertical-align: -1px; }
.marca-trecho { margin: 0; padding-left: var(--e-2); border-left: 3px solid var(--cor-borda); font-size: 13px; color: var(--cor-texto-2); max-height: 7em; overflow: auto; }
.marca-comentario-texto { margin: 0; white-space: pre-wrap; }
.marca-privada { display: flex; gap: var(--e-2); align-items: center; }
.marca-detalhe p.secundario { margin: 0; font-size: 13px; }
/* Abas do sumário (Autos, Biblioteca): mesmo desenho dos segmentos do app — unidas, a escolhida em amarelo suave com filete. */
.autos-abas { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--cor-borda); border-radius: var(--raio-controle); overflow: hidden; }
.autos-abas .botao { border: 0; border-radius: 0; height: var(--altura-padrao); }
.autos-abas .botao + .botao { border-left: 1px solid var(--cor-borda); }
.autos-abas .botao[aria-selected="true"] { background: var(--cor-marca-suave); color: var(--cor-texto); font-weight: 600; box-shadow: inset 0 -2px 0 var(--cor-marca); }
.autos-trecho { font-size: 13px; color: var(--cor-texto-2); overflow-wrap: anywhere; }

/* Leitura em foco */
.leitura-foco { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--cor-fundo); color: var(--cor-texto); }
.leitura-foco[open] { display: flex; flex-direction: column; }
.leitura-foco::backdrop { background: var(--cor-fundo); }
.leitura-barra { display: flex; justify-content: space-between; align-items: center; gap: var(--e-3); padding: var(--e-2) var(--e-4); border-bottom: 1px solid var(--cor-borda); flex-wrap: wrap; }
.leitura-titulo { font-size: 14px; color: var(--cor-texto-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.leitura-coluna { flex: 1; overflow: auto; padding: var(--e-6, 48px) max(var(--e-4), calc((100% - 68ch) / 2)); font-family: var(--fonte-leitura); line-height: 1.7; }

.leitura-pagina { margin-bottom: 1.5em; }
.leitura-num { font-size: 12px; color: var(--cor-texto-2); border-top: 1px solid var(--cor-borda); padding-top: var(--e-2); margin-bottom: 1em !important; }
.leitura-marcada { color: var(--cor-texto); }
.leitura-marca { background: none; color: inherit; }
.leitura-destaque, .leitura-comentario { background: color-mix(in srgb, var(--cor-marcacao) 40%, transparent); }
.leitura-sublinhado { text-decoration: underline 2px var(--cor-marcacao); text-underline-offset: 3px; }
.leitura-tachado { text-decoration: line-through 2px var(--cor-marcacao); }
.leitura-nota { font-family: var(--fonte-interface); font-size: 0.8em; line-height: 1.5; margin: -0.4em 0 1em; padding: var(--e-2) var(--e-3); border-left: 3px solid var(--cor-marcacao); background: var(--cor-superficie); }
@media (max-width: 599px) { .leitura-coluna { padding: var(--e-4) var(--e-3); } .leitura-barra { padding: var(--e-2) var(--e-3); } }
.leitura-barra .barra-acoes { flex-wrap: nowrap; gap: var(--e-2); }
.leitura-barra .barra-acoes > .botao { flex: 0 0 auto; }
/* Páginas giradas no PDF (/Rotate): a camada de texto gira junto com o desenho. */
.textLayer[data-main-rotation="90"] { transform: rotate(90deg) translateY(-100%); }
.textLayer[data-main-rotation="180"] { transform: rotate(180deg) translate(-100%, -100%); }
.textLayer[data-main-rotation="270"] { transform: rotate(270deg) translateX(-100%); }
.lista-simples { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--e-2); }
.lista-simples .numero { overflow-wrap: anywhere; }

/* Biblioteca */
.biblioteca-topo { display: flex; flex-wrap: wrap; gap: var(--e-3); align-items: center; }
.biblioteca-abas { width: 280px; }
.biblioteca-busca { flex: 1; min-width: 220px; }
.biblioteca-filtros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--e-3); }
.estante { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: var(--e-4) var(--e-3); }
.livro { display: flex; flex-direction: column; gap: var(--e-1); }
.livro-capa { display: flex; flex-direction: column; gap: var(--e-2); aspect-ratio: 2 / 3; padding: var(--e-3); text-align: left; cursor: pointer;
  background: var(--cor-superficie); color: var(--cor-texto); border: 1px solid var(--cor-borda); border-left: 6px solid var(--cor-marca); font: inherit; overflow: hidden; }
.livro-capa:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); }
.livro-area { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cor-texto-2); }
.livro-titulo { font-family: var(--fonte-leitura); font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.livro-autor { font-size: 13px; color: var(--cor-texto-2); }
.livro-pe { margin-top: auto; font-size: 12px; color: var(--cor-texto-2); }
.livro-editar { align-self: flex-start; font-size: 13px; }
.leis { list-style: none; margin: 0; padding: 0; }
.lei { display: flex; justify-content: space-between; align-items: center; gap: var(--e-3); padding: var(--e-2) var(--e-3); border-top: 1px solid var(--cor-borda); }
.leis .lei:first-child { border-top: 0; }
.lei-nome { overflow-wrap: anywhere; }
.lei .barra-acoes { flex-wrap: nowrap; flex: none; }
.grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e-3); }
@media (max-width: 599px) {
  .biblioteca-abas { width: 100%; }
  .biblioteca-filtros { grid-template-columns: 1fr 1fr; }
  .estante { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lei { flex-direction: column; align-items: stretch; }
  .lei .barra-acoes > .botao { flex: 1 1 auto; }
}
.envio-livros { display: flex; flex-direction: column; gap: var(--e-2); padding: var(--e-3); border: 1px dashed var(--cor-borda); }
.envio-livros p { margin: 0; }
.citacao-abnt { width: 420px; }
.citacao-previa { font-family: var(--fonte-leitura); font-size: 14px; line-height: 1.5; padding: var(--e-2); background: var(--cor-fundo); border: 1px solid var(--cor-borda); max-height: 12em; overflow: auto; text-align: justify; }
.citacao-longa { font-size: 12px; line-height: 1.3; padding-left: var(--e-6); }
.citacao-opcoes { display: flex; flex-wrap: wrap; gap: var(--e-2) var(--e-3); align-items: center; }
.citacao-abnt .barra-acoes { gap: var(--e-2); }

/* Leitura da lei */
.leitor-lei .autos-sumario { min-width: 0; }
.leitor-abas { grid-template-columns: repeat(3, 1fr); }
.indice-lei .autos-item { gap: 0; }
.indice-rotulo { font-size: 13px; font-weight: 600; }
.indice-nome { font-weight: 400; }
.leitor-corpo { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--cor-fundo); }
.leitor-texto { max-width: 72ch; margin: 0 auto; padding: var(--e-5, 32px) var(--e-4); font-family: var(--fonte-leitura); font-size: 17px; line-height: 1.65; }
.leitor-cabecalho h1 { font-family: var(--fonte-leitura); font-size: 1.5em; line-height: 1.25; font-weight: 500; margin: 0 0 var(--e-2); }
.leitor-ementa { font-style: italic; margin: var(--e-2) 0 var(--e-5, 32px) 30%; color: var(--cor-texto-2); }
.disp { position: relative; content-visibility: auto; contain-intrinsic-size: auto 3em; }
.disp p { margin: 0 0 0.6em; text-wrap: pretty; }
.disp-artigo p { margin-top: 0.9em; }
.disp-inciso p, .disp-alinea p, .disp-item p { padding-left: 1.5em; }
.disp-alinea p { padding-left: 3em; }
.disp-item p { padding-left: 4.5em; }
.disp-titulo { font-family: var(--fonte-interface); font-size: 14px; letter-spacing: 0.04em; text-align: center; margin: 2em 0 1em; font-weight: 600; display: flex; flex-direction: column; gap: 2px; }
.disp-nome { font-weight: 400; letter-spacing: 0; text-transform: none; }
.disp-parte .disp-titulo { font-size: 16px; }
.disp-notas { font-family: var(--fonte-interface); font-size: 12px; color: var(--cor-texto-2); }
.disp-piscar { background: var(--cor-marca-suave); transition: background 1.5s; }
.disp-fita { position: absolute; left: -22px; top: 0.9em; width: 10px; height: 20px; background: var(--cor-marcacao); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); }
.lei-marca { color: inherit; background: none; cursor: pointer; }
.lei-destaque, .lei-comentario { background: color-mix(in srgb, var(--cor-marcacao) 40%, transparent); }
.lei-sublinhado { text-decoration: underline 2px var(--cor-marcacao); text-underline-offset: 3px; }
.lei-tachado { text-decoration: line-through 2px var(--cor-marcacao); }
.lei-pino { display: inline-block; width: 10px; height: 10px; margin-left: 4px; border: 0; padding: 0; background: var(--cor-marcacao); cursor: pointer; vertical-align: super; }
.marcar-largo { grid-column: 1 / -1; }
.leitor-aviso-lista { padding: var(--e-2) var(--e-3); }
.versao-lei { padding: var(--e-2) var(--e-3); border-bottom: 1px solid var(--cor-borda); }
.versao-lei summary { cursor: pointer; }
.versao-artigo { margin-top: var(--e-2); font-size: 13px; }
.versao-antes, .versao-depois { padding: var(--e-1) var(--e-2); margin-top: var(--e-1); }
.versao-antes { border-left: 3px solid var(--cor-atrasado); }
.versao-depois { border-left: 3px solid var(--cor-confirmacao); }
.versao-artigo p { margin: 0.2em 0; }
.leitor-foco { grid-template-columns: 1fr; }
.selo-mini { margin-left: var(--e-1); }
@media (max-width: 599px) { .leitor-texto { font-size: 16px; padding: var(--e-3); } .disp-fita { left: -12px; } }
.leitor-abas .botao { padding-inline: var(--e-1); white-space: nowrap; }
@media (max-width: 599px) { .leitor-ementa { margin-left: 0; } }
.leitura-quebra { font-family: var(--fonte-numeros); font-size: 0.6em; color: var(--cor-texto-2); border: 1px solid var(--cor-borda); padding: 0 3px; margin: 0 4px; vertical-align: 0.15em; user-select: none; }
.livro-capa-imagem { padding: 0; border-left-width: 1px; background: var(--cor-superficie-2); }
.livro-capa-imagem img { width: 100%; height: 100%; object-fit: cover; display: block; }
.livro-legenda { display: flex; flex-direction: column; gap: 2px; }
.livro-titulo-pequeno { font-family: var(--fonte-leitura); font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ficha-arquivo { display: flex; flex-wrap: wrap; gap: var(--e-2) var(--e-3); align-items: baseline; }
.ficha-capa { width: 96px; height: auto; border: 1px solid var(--cor-borda); }
.marcar-fixa { position: fixed; z-index: 20; }
.leitura-marca { cursor: pointer; }
.leitura-dica { font-family: var(--fonte-interface); margin-top: -0.6em !important; }
.leitura-nota[data-marca] { cursor: pointer; }
.visualizador-origem { margin: 0; padding: var(--e-1) var(--e-3); border-bottom: 1px solid var(--cor-borda); }

/* Google Agenda: grupos de opções (checkbox e radio) dentro da grade */
.grupo-opcoes { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.grupo-opcoes legend { padding: 0; margin-bottom: 4px; float: left; width: 100%; }
.grupo-opcoes .barra-acoes { gap: var(--e-3); }
.campo-ajuda.bloco { display: block; }
.texto-publicado { white-space: pre-wrap; max-height: 240px; overflow: auto; margin-top: 4px; }

/* Espera: roda discreta na cor da marca + texto do passo em curso */
.carregando { display: flex; align-items: center; gap: var(--e-2); margin: 0; color: var(--cor-texto-secundario, inherit); font-size: var(--texto-rotulo, 13px); }
.carregando-roda { flex: none; width: 16px; height: 16px; border: 2px solid var(--cor-borda); border-top-color: var(--cor-marca); border-radius: 50%; animation: girar 0.8s linear infinite; }
.carregando-tempo { opacity: 0.7; }
@keyframes girar { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .carregando-roda { animation-duration: 2.4s; } }
.carregando-linha { display: inline-flex; vertical-align: middle; }
.painel-movimentacoes { padding: 0 var(--e-3); }

/* Financeiro: condições do contrato em partes, parcelas e próximos recebimentos */
.texto-atrasado { color: var(--cor-atrasado); }
.contrato-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--e-3); margin: 0; }
.contrato-resumo dd { margin: var(--e-1) 0 0; font-size: var(--texto-titulo-3, 18px); }
.contrato-parte-leitura { display: grid; gap: 4px; padding-top: var(--e-3); border-top: 1px solid var(--cor-borda); }
.contrato-parte-leitura .rolagem-x { margin-top: var(--e-1); }
.contrato-parte-leitura p { margin: 0; }
/* Cada parte do contrato: bloco separado por linha fina (sem cartão dentro de cartão), título editável no lugar de “Parte 1”. */
.contrato-parte { border: 0; border-top: 1px solid var(--cor-borda); margin: 0; padding: var(--e-3) 0 0; min-width: 0; display: flex; flex-direction: column; gap: var(--e-3); }
.contrato-parte:first-child { border-top: 0; padding-top: 0; }
.contrato-parte-cabecalho { display: flex; align-items: center; justify-content: space-between; gap: var(--e-3); }
.titulo-editavel { flex: 1 1 auto; min-width: 0; max-width: 480px; height: 40px; padding: 0 8px; margin-left: -8px; border: 1px solid transparent; border-radius: 2px;
  background: none; color: var(--cor-texto); font: inherit; font-size: 18px; font-weight: 600; }
.titulo-editavel:hover { border-color: var(--cor-borda); }
.titulo-editavel:focus { outline: 2px solid var(--cor-marca); outline-offset: -1px; border-color: var(--cor-marca); background: var(--cor-superficie); }
.titulo-editavel::placeholder { color: var(--cor-texto); opacity: .55; }
.contrato-parte-titulo { margin: 0; font-size: 16px; line-height: 24px; }
.contrato-parte-leitura .secundario, .contrato-parte-leitura .campo-ajuda { margin: 0; }
.tabela-parcelas input[type="date"], .tabela-parcelas input.numero { width: 100%; min-width: 120px; }
.tabela-parcelas .campo.sem-rotulo { margin: 0; }
.tabela-parcelas .campo.sem-rotulo > .rotulo:empty { display: none; }
.tabela-parcelas td { vertical-align: middle; }
.selo.parcela-paga { border-color: var(--cor-confirmacao); color: var(--cor-confirmacao); }
.selo.parcela-atrasada, .selo.parcela-hoje { border-color: var(--cor-atrasado); color: var(--cor-atrasado); }
.selo.parcela-a_vencer { border-color: var(--cor-vence-breve); color: var(--cor-vence-breve); }
.selo.parcela-aguardando { color: var(--cor-texto-2); }
.lista-recebimentos li { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: var(--e-3); align-items: baseline; }
@media (max-width: 640px) { .lista-recebimentos li { grid-template-columns: 1fr; gap: var(--e-1); } }
.ag-recebimento { --ag-cor: var(--cor-marca); }
.lista-recebimentos { list-style: none; margin: 0; padding: 0 var(--e-4) var(--e-4); }
.lista-recebimentos li { padding: var(--e-2) 0; border-top: 1px solid var(--cor-borda); }
.lista-recebimentos li:first-child { border-top: 0; }

/* Andamento e Compromissos: seções que reúnem subseções (prazos + linha do tempo; atos do processo + fora do processo) */
.subsecao { display: grid; gap: var(--e-2); min-width: 0; }
.subsecao + .subsecao { padding-top: var(--e-4); border-top: 1px solid var(--cor-borda); }
.subsecao-titulo { margin: 0; font-size: var(--texto-rotulo); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--cor-texto-2); }
.andamento-prazos[data-ocultar="sim"] .subsecao-titulo, .andamento-prazos[data-ocultar="sim"] .subsecao > .pilha-curta > :not(dialog) { display: none; }
.andamento-prazos[data-ocultar="sim"] .subsecao { padding: 0; }
.andamento-prazos + .subsecao { padding-top: var(--e-4); border-top: 1px solid var(--cor-borda); }
.andamento-prazos[data-ocultar="sim"] + .subsecao { padding-top: 0; border-top: 0; }
.selo-ato { height: 20px; margin-right: var(--e-2); padding: 0 var(--e-1); border-color: var(--cor-marca); background: var(--cor-marca-suave); vertical-align: 1px; }
.cumprir-prazo { margin-top: var(--e-2); padding: var(--e-3); border: 1px solid var(--cor-borda); }

/* Menus suspensos (“Novo ▾”, “+”, “Registrar”…): painel sob o botão, grupos com título, “?” com balão */
.menu-suspenso { position: relative; display: inline-block; }
.menu-seta { margin-left: 4px; transition: transform .15s; }
.menu-suspenso.aberto .menu-seta { transform: rotate(180deg); }
.menu-suspenso-fundo { display: none; }
.menu-suspenso-painel { position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; width: 280px; max-height: min(70vh, 560px); overflow-y: auto;
  padding: 4px 0; background: var(--cor-superficie); color: var(--cor-texto); border: 1px solid var(--cor-borda); border-radius: 4px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .12); text-align: left; }
.menu-suspenso-titulo { display: none; }
.ms-grupo { display: flex; flex-direction: column; padding: 4px 0; }
.ms-grupo + .ms-grupo, .menu-suspenso-painel > .ms-grupo ~ :not(.ms-grupo) { border-top: 1px solid var(--cor-borda); }
.ms-grupo-titulo { padding: 4px var(--e-3) 4px; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--cor-texto-2); }
.ms-linha { position: relative; display: flex; align-items: center; }
.ms-linha > :first-child { flex: 1 1 auto; min-width: 0; }
/* Itens: linhas de 40 px, texto à esquerda, mesmo recuo; os botões e links do “+” ganham o mesmo visual. */
.ms-item, .menu-suspenso-painel .botao, .menu-suspenso-painel a.botao {
  display: flex; align-items: center; width: 100%; min-height: 40px; height: auto; padding: 8px var(--e-3); margin: 0; gap: 8px;
  justify-content: flex-start; text-align: left; background: none; border: 0; border-left: 2px solid transparent; border-radius: 0;
  color: var(--cor-texto); font: inherit; font-weight: 400; line-height: 20px; cursor: pointer; text-decoration: none; white-space: normal; }
.ms-item:hover, .ms-item:focus-visible, .menu-suspenso-painel .botao:hover, .menu-suspenso-painel .botao:focus-visible {
  background: var(--cor-fundo); border-left-color: var(--cor-marca); outline: none; }
.menu-suspenso-painel .botao:disabled { opacity: .55; cursor: default; }
.ms-item.perigo, .menu-suspenso-painel .botao-perigo { color: var(--cor-atrasado); }
.menu-suspenso-painel .botao-perigo { border-top: 1px solid var(--cor-borda); margin-top: 4px; padding-top: 8px; }
.menu-suspenso-painel .botao-perigo:hover, .menu-suspenso-painel .botao-perigo:focus-visible { border-left-color: var(--cor-atrasado); }
.menu-suspenso-painel > .campo-erro, .ms-grupo > .campo-erro { padding: 0 var(--e-3) 8px; margin: 0; }
.menu-suspenso-painel > .ms-linha .ms-item { padding-right: 40px; }

/* “?” com balão: aparece ao passar o mouse no item ou no “?”, ou ao focar */
.dica { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-right: var(--e-3);
  border: 1px solid var(--cor-borda); border-radius: 50%; font-size: 11px; font-weight: 600; line-height: 1; color: var(--cor-texto-2); cursor: help; position: relative; }
.dica:focus-visible { outline: 2px solid var(--cor-marca); outline-offset: 1px; }
.dica::after { content: attr(data-dica); position: absolute; right: -8px; bottom: calc(100% + 8px); z-index: 50; width: max-content; max-width: 240px;
  padding: 8px 12px; border-radius: 4px; background: var(--cor-texto); color: var(--cor-superficie); font-size: 13px; font-weight: 400; line-height: 18px;
  text-align: left; white-space: normal; box-shadow: 0 4px 12px rgba(0, 0, 0, .18); opacity: 0; visibility: hidden; transition: opacity .12s; pointer-events: none; }
.dica::before { content: ""; position: absolute; right: 4px; bottom: calc(100% + 2px); border: 6px solid transparent; border-top-color: var(--cor-texto); border-bottom: 0;
  opacity: 0; visibility: hidden; transition: opacity .12s; z-index: 50; }
/* A dica só aparece ao passar o mouse no “?” (ou ao chegar nele, ou no item, pelo teclado): não fica aberta cobrindo as opções. */
.dica:hover::after, .dica:hover::before, .dica:focus-visible::after, .dica:focus-visible::before,
.ms-linha:has(> .ms-item:focus-visible) > .dica::after, .ms-linha:has(> .ms-item:focus-visible) > .dica::before { opacity: 1; visibility: visible; transition-delay: .35s; }
.ms-linha:hover > .dica { border-color: var(--cor-marca); color: var(--cor-texto); }
/* Primeiras linhas do painel: o balão desce em vez de subir (não corta no topo). */
.menu-suspenso-titulo + .ms-grupo > .ms-linha:nth-child(-n+3) > .dica::after { bottom: auto; top: calc(100% + 8px); }
.menu-suspenso-titulo + .ms-grupo > .ms-linha:nth-child(-n+3) > .dica::before { bottom: auto; top: calc(100% + 2px); border-top-color: transparent; border-bottom: 6px solid var(--cor-texto); }

@media (max-width: 599px) {
  .menu-suspenso-fundo { display: block; position: fixed; inset: 0; z-index: 39; background: rgba(0, 0, 0, .35); }
  .menu-suspenso-painel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 75dvh; border-radius: 4px 4px 0 0;
    padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .menu-suspenso-titulo { display: block; padding: 12px var(--e-3) 8px; font-weight: 600; border-bottom: 1px solid var(--cor-borda); }
  .ms-item, .menu-suspenso-painel .botao, .menu-suspenso-painel a.botao { min-height: 48px; }
  .dica::after { right: -4px; max-width: min(260px, calc(100vw - 48px)); }
}
@media (max-width: 599px) { .topo-linha > .barra-acoes > .menu-suspenso-texto > .botao { width: 100%; } }
.ms-linha:hover, .ms-linha:focus-within { background: var(--cor-fundo); }

@media (max-width: 599px) { .atos-a-fazer .linha-ato { grid-template-columns: 1fr; gap: 4px; } }

  .plano-lista li { grid-template-columns: 24px minmax(0, 1fr); padding: 4px 0; }

  /* Filtros em segmentos no cabeçalho de uma seção: ficam numa linha própria, lado a lado. */
  .cartao-cabecalho:has(> .cabecalho-acoes > .segmentos) { flex-wrap: wrap; height: auto; min-height: 56px; row-gap: var(--e-2); padding-top: var(--e-2); padding-bottom: var(--e-2); }
  .cabecalho-acoes:has(> .segmentos) { width: 100%; flex-wrap: nowrap; justify-content: space-between; gap: var(--e-2); }

/* Textos longos (descrição, observação, pauta, registro): caixa alta desde o início, que cresce com o texto e pode ser puxada. */
.campo textarea { min-height: 144px; resize: vertical; field-sizing: content; max-height: 70vh; line-height: 24px; }
/* Abas em grade (muitas abas, como nas Configurações): linhas iguais, sem cortar; as linhas finas vêm do espaço de 1 px. */
