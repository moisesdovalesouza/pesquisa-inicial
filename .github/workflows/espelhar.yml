name: Espelhar do Termo Inicial

# A Pesquisa Inicial é escrita no Termo Inicial; este repositório só copia a versão avulsa publicada lá.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/**"]

permissions:
  contents: write

concurrency:
  group: espelho
  cancel-in-progress: false

jobs:
  espelhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar a versão publicada no Termo Inicial
        run: python3 .github/espelho/espelhar.py
      - name: Gravar (se mudou) e manter o agendamento ativo
        run: |
          git config user.name "Espelho do Termo Inicial"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Pesquisa Inicial $(python3 -c 'import json;print(json.load(open("versao.json"))["versao"])') (espelho do Termo Inicial)"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            # O GitHub desliga agendamentos de repositórios parados há 60 dias.
            git commit --allow-empty -m "Espelho ativo (sem mudanças há 45 dias)"
            git push
          fi
